<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ike Sales</title>
<!-- The expenses service's public base URL, filled in once by the owner after
     `wrangler deploy` (D9: no build step; D10: no secret in the page — a URL is
     not a secret and no PIN or key is ever placed here). While it is empty the
     Expenses pane makes no service call and says so plainly. -->
<meta name="ike-expenses-service" content="https://odoo.ike-mrh.workers.dev">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  /* An author display rule outranks the UA stylesheet's [hidden]{display:none},
     so .detail{display:flex} would otherwise render every row expanded. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #f4f7f6;
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) { body { background: #0b1614; } }

  /* One set of neutrals for the whole app. Each pane takes its own --accent
     from the two page colours below: banked teal for Sales, amber for
     Quotations (money that is still awaited). The tab bar uses the same two. */
  .app {
    --bg: #f4f7f6; --surface: #ffffff; --muted: #edf2f0; --ink: #0d1f1c; --ink2: #4c5f5b; --ink3: #7c8c88;
    --border: rgba(13,31,28,0.08); --grid: #e1e6e4;
    --sales: #0f6f68; --quotes: #9a5b12; --expenses: #8a3f64;
    --shadow: 0 1px 2px rgba(13,31,28,0.05), 0 12px 32px -16px rgba(13,31,28,0.22);
    height: 100vh; height: 100dvh;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .app {
      --bg: #0b1614; --surface: #11201d; --muted: #162622; --ink: #f2f6f5; --ink2: #b7c6c2; --ink3: #82938e;
      --border: rgba(255,255,255,0.08); --grid: #223330;
      --sales: #29b3a6; --quotes: #e0a458; --expenses: #d98ab0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 32px -16px rgba(0,0,0,0.6);
    }
  }

  /* ---- Pager: the full-width panes in a scroll-snap row. The browser does the
     finger tracking, the rubber-banding and the snap; the tab bar only reads
     scrollLeft. Every pane is laid out all the time (never display:none), so
     the offscreen chart can still measure itself. */
  .pager { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; }
  .pager::-webkit-scrollbar { display: none; }
  .pane { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; }
  /* Sales fits the screen and scrolls its list inside the card. */
  .pane-sales { display: flex; flex-direction: column; overflow: hidden; outline: none; --accent: var(--sales); }
  /* Quotations is a long page of cards, so the pane itself scrolls. */
  .pane-quotes { overflow-y: auto; overscroll-behavior-y: contain; --accent: var(--quotes); --accent-soft: rgba(154,91,18,0.12); --order: #2f5f8c; --order-soft: rgba(47,95,140,0.12); --warn: #8c2f2f; --warn-soft: rgba(140,47,47,0.10); --rule: #e8edeb; }
  /* Expenses is a fixed-height pane: the hero, the categories and the day's
     entries scroll inside it, so the Add button can sit still over the corner. */
  .pane-expenses { position: relative; display: flex; flex-direction: column; overflow: hidden; --accent: var(--expenses); --accent-soft: rgba(138,63,100,0.12); --wait: #7a4809; --wait-soft: rgba(154,91,18,0.12); --ok: #0b5750; --ok-soft: rgba(15,111,104,0.12); --bad: #8c2f2f; --bad-soft: rgba(140,47,47,0.10); --rule: #e8edeb; }
  @media (prefers-color-scheme: dark) {
    .pane-quotes { --accent-soft: rgba(224,164,88,0.14); --order: #7fb0de; --order-soft: rgba(127,176,222,0.14); --warn: #e08585; --warn-soft: rgba(224,133,133,0.12); --rule: #1e2d2a; }
    .pane-expenses { --accent-soft: rgba(217,138,176,0.16); --wait: #e0a458; --wait-soft: rgba(224,164,88,0.14); --ok: #29b3a6; --ok-soft: rgba(41,179,166,0.14); --bad: #e08585; --bad-soft: rgba(224,133,133,0.12); --rule: #1e2d2a; }
  }

  /* ---- Bottom tab bar. The indicator is positioned from the pager's scroll
     progress, so it follows a swipe as it happens rather than jumping at the end. */
  .tabbar { flex: 0 0 auto; display: flex; justify-content: center; padding: 0 16px env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); }
  .tabs { position: relative; display: flex; width: 100%; max-width: 420px; }
  .tab { flex: 1; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; font-size: 11.5px; font-weight: 600; line-height: 1; color: var(--ink3); cursor: pointer; transition: color 0.2s; }
  .tab svg { transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .tab:active svg { transform: scale(0.88); }
  .tab[data-pane="0"][aria-selected="true"] { color: var(--sales); }
  .tab[data-pane="1"][aria-selected="true"] { color: var(--quotes); }
  .tab[data-pane="2"][aria-selected="true"] { color: var(--expenses); }
  .tab:focus-visible { outline: 2px solid var(--ink2); outline-offset: -6px; border-radius: 14px; }
  /* One tab wide, so translateX(p * 100%) is exactly p panes across. */
  .tabind { position: absolute; top: 0; left: 0; width: 33.3333%; height: 3px; pointer-events: none; will-change: transform; }
  .tabind::before { content: ""; display: block; width: 32px; height: 3px; margin: 0 auto; border-radius: 0 0 3px 3px; background: var(--sales); }
  /* Blend teal into amber while the pager is between panes. Gated, because a
     var() that resolves to an unsupported color-mix() would blank the colour
     rather than fall back to the declaration above. */
  @supports (color: color-mix(in srgb, red, blue)) {
    .tabind::before { background: var(--ind, var(--sales)); }
  }

  /* =================== Sales pane =================== */
  /* An author display rule outranks the UA stylesheet's [hidden]{display:none},
     so .detail{display:flex} would otherwise render every row expanded. */
  .pane-sales .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 10px; width: 100%; max-width: 1160px; margin: 0 auto; }
  .pane-sales .topbar { display: flex; flex-direction: column; gap: 12px; }
  .pane-sales .pillswrap { position: relative; min-width: 0; }
  .pane-sales .pills { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding: 4px 0; }
  .pane-sales .fade { position: absolute; top: 0; bottom: 0; left: 0; width: 96px; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(244,247,246,0) 100%); pointer-events: none; transition: opacity 0.25s; opacity: 0; }
  @media (prefers-color-scheme: dark) {
  .pane-sales .fade { background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(11,22,20,0) 100%); }
  }
  .pane-sales .pills::-webkit-scrollbar { display: none; }
  .pane-sales .pill { flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font-family: "Source Sans 3", system-ui, sans-serif; font-weight: 600; font-size: 13px; line-height: 1; cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
  .pane-sales .daterow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 0; }
  .pane-sales .dayname { font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; line-height: 1.15; }
  .pane-sales .daydate { font-size: 13px; color: var(--ink2); margin-top: 2px; }
  .pane-sales .main { flex: 1; min-height: 0; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  .pane-sales .content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 14px; }
  .pane-sales .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
  .pane-sales .hero { padding: 18px 18px 14px; display: flex; flex-direction: column; }
  .pane-sales .total { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .pane-sales .cur { font-size: 15px; font-weight: 700; color: var(--ink2); letter-spacing: 0.02em; }
  .pane-sales .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; margin-top: 8px; }
  .pane-sales .chart { display: flex; align-items: stretch; gap: 10px; height: 150px; margin-top: 18px; }
  .pane-sales .axis { position: relative; flex: 0 0 30px; margin-top: 20px; margin-bottom: 19px; }
  .pane-sales .axis span { position: absolute; right: 0; transform: translateY(-50%); font-size: 10.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* The gridlines sit in this wrapper rather than in the scroller, so they
     stay put while the bars scroll under them - a gridline that scrolled away
     from its own axis label would be worse than no gridline. */
  .pane-sales .plotwrap { position: relative; flex: 1; min-width: 0; }
  /* The page swipes left/right between Sales and Quotations. pan-x hands a
     horizontal drag that starts on the chart to this scroller, and
     overscroll-behavior-x: contain stops it carrying on into the pager once
     the chart reaches either end. */
  .pane-sales .plot { position: relative; height: 100%; display: flex; align-items: stretch; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior-x: contain; touch-action: pan-x; }
  .pane-sales .plot::-webkit-scrollbar { display: none; }
  .pane-sales .grid { position: absolute; left: 0; right: 0; top: 20px; bottom: 19px; pointer-events: none; }
  .pane-sales .grid i { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); font-style: normal; }
  .pane-sales .bar { position: relative; flex: 0 0 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .pane-sales .barcol { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .pane-sales .barfill { width: 70%; max-width: 30px; min-height: 3px; border-radius: 5px 5px 2px 2px; transition: height 280ms cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, opacity 0.2s ease; }
  .pane-sales .barlbl { height: 28px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--ink3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pane-sales .barlbl .disc { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: #ffffff; font-weight: 700; font-size: 12.5px; }
  .pane-sales .list { display: flex; flex-direction: column; min-height: 0; }
  .pane-sales .listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 8px; }
  .pane-sales .listtitle { font-family: Manrope, sans-serif; font-weight: 700; font-size: 15px; }
  .pane-sales .count { font-size: 12.5px; color: var(--ink3); }
  /* Segmented control: both views describe the same money, so this swaps only
     what the card lists - the total, chart and pills above are untouched. */
  .pane-sales .seg { display: inline-flex; padding: 2px; background: var(--muted); border-radius: 999px; gap: 2px; flex: 0 0 auto; }
  .pane-sales .seg button { border: 0; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: none; color: var(--ink3); transition: background 180ms ease, color 180ms ease; }
  .pane-sales .seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(13,31,28,0.12); }
  .pane-sales .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* ---- invoice rows ---- */
  .pane-sales .item + .item > .row { box-shadow: inset 0 1px 0 var(--rule); }
  .pane-sales .row.has { cursor: pointer; width: 100%; font: inherit; color: inherit; background: none; border: 0; text-align: left; }
  .pane-sales .row.has:hover, .pane-sales .row.has[aria-expanded="true"] { background: var(--muted); box-shadow: none; }
  .pane-sales .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .pane-sales .ref { flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pane-sales .cust { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pane-sales .cust.anon { font-weight: 400; color: var(--ink3); font-style: italic; }
  .pane-sales .chev { flex: 0 0 auto; color: var(--ink3); transition: transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), color 200ms ease; transition: transform 420ms linear(0, 0.0693, 0.2322, 0.4328, 0.6312, 0.8028, 0.9356, 1.0269, 1.0807, 1.1039, 1.1052, 1.0924, 1.0726, 1.0508, 1.0307, 1.0141, 1.002, 0.9941, 0.9899, 0.9886, 0.9892, 0.991, 0.9933, 0.9956, 0.9976, 0.9991, 1), color 200ms ease; }
  .pane-sales .row[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }
  /* Animating to a height nothing has measured: the wrapper is a grid whose
     single row goes 0fr -> 1fr, which interpolates, unlike height:auto. The
     linear() curves are a damped spring sampled at 27 points; each is preceded
     by a cubic-bezier of roughly the same shape, so an engine that cannot parse
     linear() degrades rather than snapping. */
  .pane-sales .detailwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms cubic-bezier(0.45, 0, 0.7, 0.25); }
  .pane-sales .detailwrap.open {
    grid-template-rows: 1fr;
    transition: grid-template-rows 440ms cubic-bezier(0.34, 1.4, 0.64, 1);
    transition: grid-template-rows 440ms linear(0, 0.0506, 0.17, 0.3201, 0.4748, 0.6178, 0.7404, 0.8392, 0.9142, 0.9677, 1.0033, 1.0246, 1.0352, 1.0384, 1.0367, 1.0323, 1.0266, 1.0206, 1.0151, 1.0103, 1.0064, 1.0035, 1.0014, 1, 0.9991, 0.9987, 1);
  }
  .pane-sales .detailclip { overflow: hidden; min-height: 0; }
  .pane-sales .detail { margin: 2px 10px 8px; padding: 9px 12px 10px; background: var(--muted); border-radius: 11px; display: flex; flex-direction: column; gap: 5px; opacity: 0; transform: translateY(-9px) scale(0.985); transition: opacity 150ms ease, transform 260ms cubic-bezier(0.5, -0.2, 0.75, 0.4); }
  .pane-sales .detailwrap.open .detail {
    opacity: 1; transform: none;
    transition: opacity 200ms ease 30ms, transform 520ms cubic-bezier(0.34, 1.56, 0.64, 1);
    transition: opacity 200ms ease 30ms, transform 520ms linear(0, 0.0693, 0.2322, 0.4328, 0.6312, 0.8028, 0.9356, 1.0269, 1.0807, 1.1039, 1.1052, 1.0924, 1.0726, 1.0508, 1.0307, 1.0141, 1.002, 0.9941, 0.9899, 0.9886, 0.9892, 0.991, 0.9933, 0.9956, 0.9976, 0.9991, 1);
  }
  .pane-sales .lhead { display: flex; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink3); padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .pane-sales .lrow { display: flex; gap: 12px; font-size: 13px; align-items: baseline; }
  .pane-sales .lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  .pane-sales .lqty { flex: 0 0 46px; text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .pane-sales .ltot { flex: 0 0 72px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .pane-sales .emptylist { margin: auto; padding: 22px; text-align: center; color: var(--ink3); font-size: 13.5px; }
  /* Listed last so it outranks the .open rules above at equal specificity. */
  .pane-sales .detailwrap.instant, .pane-sales .detailwrap.instant .detail { transition: none; }
  .pane-sales .rows { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
  .pane-sales .row { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 12px; }
  .pane-sales .row:hover { background: var(--muted); }
  .pane-sales .rank { flex: 0 0 24px; height: 24px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pane-sales .pname { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pane-sales .pn { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pane-sales .pq { font-size: 12px; color: var(--ink3); }
  .pane-sales .pt { font-family: Manrope, sans-serif; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pane-sales .state-msg { margin: auto; max-width: 420px; text-align: center; color: var(--ink2); font-size: 14.5px; padding: 24px; }
  @media (prefers-reduced-motion: reduce) {
  .pane-sales .plot { scroll-behavior: auto; }
    .pane-sales .barfill { transition: background 0.2s ease, opacity 0.2s ease; }
    .pane-sales .chev, .pane-sales .detailwrap, .pane-sales .detail { transition: none !important; }
    .pane-sales .detail { opacity: 1; transform: none; }
  }
  @keyframes s-rise-a { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes s-rise-b { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (min-width: 900px) {
  .pane-sales .shell { padding: 36px 40px 20px; gap: 20px; }
    .pane-sales .topbar { flex-direction: row; align-items: center; justify-content: flex-start; }
    .pane-sales .content { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 22px; }
    .pane-sales .hero { padding: 28px 28px 22px; }
    .pane-sales .dayname { font-size: 26px; }
    .pane-sales .daydate { font-size: 14px; }
    .pane-sales .total { font-size: 64px; margin-top: 8px; }
    .pane-sales .cur { font-size: 20px; }
    .pane-sales .delta { font-size: 14.5px; margin-top: 12px; }
    .pane-sales .chart { height: 240px; margin-top: auto; }
    .pane-sales .plot { gap: 10px; }
    .pane-sales .bar { flex: 0 0 32px; }
    .pane-sales .listhead { padding: 22px 24px 10px; }
    .pane-sales .row { padding: 13px 14px; }
  }

  /* ================= Quotations pane ================= */
  /* An author display rule outranks the UA stylesheet's [hidden]{display:none},
     so .detail{display:flex} would otherwise render every row expanded. */
  /* Same neutrals as ike-sales / ike-pos. The accent is the one thing that
     differs: amber reads "awaiting", where sales is banked teal. */
  .pane-quotes .shell { display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 28px; width: 100%; max-width: 1160px; margin: 0 auto; }
  /* The All pill sits outside the scroller, so the day pills slide under it. */
  .pane-quotes .pillbar { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pane-quotes .allpill { flex: 0 0 auto; position: relative; z-index: 2; }
  .pane-quotes .pillswrap { position: relative; flex: 1; min-width: 0; }
  .pane-quotes .pills { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; padding: 4px 0; scroll-padding-left: 8px; }
  .pane-quotes .pills::-webkit-scrollbar { display: none; }
  .pane-quotes .fade { position: absolute; top: 0; bottom: 0; left: -4px; width: 40px; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 30%, rgba(244,247,246,0) 100%); pointer-events: none; transition: opacity 0.25s; opacity: 0; }
  @media (prefers-color-scheme: dark) {
  .pane-quotes .fade { background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 30%, rgba(11,22,20,0) 100%); }
  }
  .pane-quotes .pill { flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font-family: "Source Sans 3", system-ui, sans-serif; font-weight: 600; font-size: 13px; line-height: 1; cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }
  .pane-quotes .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pane-quotes .daterow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 2px 2px 0; }
  .pane-quotes .daterowend { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
  /* One control for the page, not one per card: it is a way of reading both
     cards, and the same money either way. */
  .pane-quotes .seg { display: inline-flex; padding: 2px; background: var(--muted); border-radius: 999px; gap: 2px; flex: 0 0 auto; }
  .pane-quotes .seg button { border: 0; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: none; color: var(--ink3); transition: background 180ms ease, color 180ms ease; }
  .pane-quotes .seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(13,31,28,0.12); }
  .pane-quotes .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* product rows */

<script>
// The day both panes are looking at. A pane that changes day calls
// ikeDay.set(date, itsName); every other pane's listener hears it. Dates are
// ISO strings, so the panes need no shared day indexing. Quotations' "All"
// is not a day and is never broadcast: Sales has nothing to show for it.
window.ikeDay = (function () {
  var date = null, subs = [];
  return {
    get: function () { return date; },
    set: function (d, from) {
      date = d;
      subs.forEach(function (s) { if (s.from !== from) s.fn(d); });
    },
    on: function (from, fn) { subs.push({ from: from, fn: fn }); }
  };
})();
</script>
<script>
// Pager + tab bar. Swiping scrolls the pager; tapping a tab scrolls it for you.
// Either way the tab bar is driven by the pager's scrollLeft, so there is one
// source of truth for "which pane" and the indicator follows the finger.
(function () {
  var pager = document.getElementById('pager');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('#tabs .tab'));
  var ind = document.getElementById('tabind');
  var last = tabs.length - 1;
  // One accent per pane, in pane order: the indicator interpolates between
  // neighbours as the pager scrolls.
  var ACCENTS = ['var(--sales)', 'var(--quotes)', 'var(--expenses)'];
  var cur = 0, ticking = false;

  function reduceMotion() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  function select(i) {
    cur = i;
    tabs.forEach(function (tab, n) {
      tab.setAttribute('aria-selected', n === i ? 'true' : 'false');
      tab.setAttribute('tabindex', n === i ? '0' : '-1');
    });
  }

  function sync() {
    ticking = false;
    var w = pager.clientWidth || 1;
    var p = Math.max(0, Math.min(last, pager.scrollLeft / w));
    ind.style.transform = 'translateX(' + (p * 100) + '%)';
    // Blend only between the two accents the pager is actually between, so the
    // indicator keeps following the finger once there are more than two panes.
    var lo = Math.max(0, Math.min(last, Math.floor(p)));
    var hi = Math.min(last, lo + 1);
    var mix = Math.round((p - lo) * 100);
    ind.style.setProperty('--ind', 'color-mix(in srgb, ' + ACCENTS[hi] + ' ' + mix + '%, ' + ACCENTS[lo] + ')');
    var i = Math.round(p);
    if (i !== cur) select(i);
  }

  function goTo(i, instant) {
    pager.scrollTo({ left: i * pager.clientWidth, behavior: instant || reduceMotion() ? 'instant' : 'smooth' });
  }

  pager.addEventListener('scroll', function () {
    if (!ticking) { ticking = true; requestAnimationFrame(sync); }
  }, { passive: true });

  tabs.forEach(function (tab, i) {
    tab.addEventListener('click', function () { goTo(i); });
  });

  // Roving tabindex: left/right move between the two tabs, as in a tablist.
  document.getElementById('tabs').addEventListener('keydown', function (e) {
    var to = e.key === 'ArrowLeft' ? cur - 1 : e.key === 'ArrowRight' ? cur + 1 : null;
    if (to === null || to < 0 || to > last) return;
    e.preventDefault();
    goTo(to);
    tabs[to].focus();
  });

  // A resize changes the pane width, so scrollLeft no longer lands on a pane.
  window.addEventListener('resize', function () { goTo(cur, true); });

  sync();
})();
</script>
<script>
(function () {
  var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function compact(n) {
    if (n < 1000) return fmt(n);
    var k = n / 1000;
    return (Math.round(k * 10) / 10).toString().replace(/\.0$/, '') + 'k';
  }
  function niceCeil(n) {
    var exp = Math.pow(10, Math.floor(Math.log10(n)));
    var f = n / exp, steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) { if (steps[i] >= f) return steps[i] * exp; }
    return 10 * exp;
  }
  function stripCode(name) {
    return String(name).replace(/^\[[^\]]*\]\s*/, '').trim();
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- Build view-model days from the ike-data sales feed (k=0 today ... k=N-1 oldest) ----
  function buildViewDays(rawDays) {
    var asc = rawDays.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var arr = asc.slice().reverse(); // today first
    return arr.map(function (rd, k) {
      var d = new Date(rd.date + 'T00:00:00Z');
      var wd = DAYN[d.getUTCDay()], dn = d.getUTCDate(), mo = MON[d.getUTCMonth()], yr = d.getUTCFullYear();
      // pos = received through the POS, regularSales = received through an
      // accounting payment. Their sum is the money that arrived that day.
      var total = (rd.pos ? rd.pos.total : 0) + (rd.regularSales ? rd.regularSales.total : 0);

      var transactions = (rd.transactions || []).slice()
        .sort(function (a, b) { return b.amount - a.amount; });

      // Products are DERIVED from the transactions rather than stored beside
      // them, so the two views cannot drift apart - they read one source. Once
      // per reference, not once per payment: two instalments against one
      // invoice carry the same line set, and counting both would report twice
      // the goods. Falls back to a stored products array for day entries
      // written before the pipeline began carrying transactions.
      var aggMap = {}, seenRefs = {};
      if (transactions.length) {
        transactions.forEach(function (tx) {
          if (seenRefs[tx.ref]) return;
          seenRefs[tx.ref] = true;
          (tx.lines || []).forEach(function (l) {
            var name = stripCode(l.name);
            var a = aggMap[name] || (aggMap[name] = { name: name, qty: 0, total: 0 });
            a.qty += l.qty; a.total += l.total;
          });
        });
      } else {
        (rd.products || []).forEach(function (p) {
          var name = stripCode(p.name);
          var a = aggMap[name] || (aggMap[name] = { name: name, qty: 0, total: 0 });
          a.qty += p.qty; a.total += p.total;
        });
      }
      var products = Object.keys(aggMap).map(function (n) { return aggMap[n]; })
        .sort(function (a, b) { return b.total - a.total || a.name.localeCompare(b.name); });

      return {
        k: k, date: rd.date, wd: wd, dn: dn, total: total,
        products: products, count: products.length, transactions: transactions,
        label: k === 0 ? 'Today' : wd.slice(0, 3) + ' ' + dn,
        dateFull: dn + ' ' + mo + ' ' + yr,
        short: wd.slice(0, 3) + ' ' + dn + ' ' + mo.slice(0, 3)
      };
    });
  }

  // ---- App ----
  var appEl = document.getElementById('pane-sales');
  var pillsEl = document.getElementById('s-pills');
  var fadeEl = document.getElementById('s-fade');
  var daynameEl = document.getElementById('s-dayname');
  var daydateEl = document.getElementById('s-daydate');
  var contentEl = document.getElementById('s-content');

  var days = [];
  var VIEW_KEY = 'ike-sales-view';
  function loadView() {
    try { return localStorage.getItem(VIEW_KEY) === 'products' ? 'products' : 'invoices'; }
    catch (e) { return 'invoices'; }   // private window, blocked storage
  }
  function saveView(v) { try { localStorage.setItem(VIEW_KEY, v); } catch (e) {} }

  var state = { idx: 0, shown: 0, tick: 0, view: loadView() };
  var raf = null;

  function go(i) {
    if (i < 0 || i >= days.length || i === state.idx) return;
    state.idx = i;
    renderDay();
    ikeDay.set(days[i].date, 'sales');
  }

  // Quotations picked a day. A date older than the 60 retained here is ignored.
  ikeDay.on('sales', function (date) {
    if (!days.length) return;
    for (var k = 0; k < days.length; k++) {
      if (days[k].date === date) {
        if (k !== state.idx) { state.idx = k; renderDay(); }
        return;
      }
    }
  });

  function parity() { return (++state.tick) % 2 ? 'b' : 'a'; }

  function countUp(from, to) {
    if (raf) cancelAnimationFrame(raf);
    var start = null, dur = 500;
    function step(t) {
      if (start === null) start = t;
      var p = Math.min(1, (t - start) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      setTotalText(from + (to - from) * e);
      if (p < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }
  function setTotalText(v) {
    var el = document.getElementById('s-heroValue');
    if (el) el.textContent = fmt(v);
  }

  // Swiping is the pager's now: a horizontal drag moves between Sales and
  // Quotations, so days are changed from the pills, the bars, or these keys.
  // preventDefault keeps the arrow from also nudging the pager.
  appEl.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(state.idx + 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(state.idx - 1); }
  });

  // ---- Pills (built once, updated in place) ----
  function buildPills() {
    var ordered = days.slice().reverse(); // oldest left, today right
    pillsEl.innerHTML = ordered.map(function (d) {
      return '<button class="pill" data-idx="' + d.k + '">' + escapeHtml(d.label) + '</button>';
    }).join('');
    pillsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.pill');
      if (!btn) return;
      go(parseInt(btn.getAttribute('data-idx'), 10));
    });
    pillsEl.addEventListener('scroll', function () { syncFade(); });
    requestAnimationFrame(function () {
      try { pillsEl.scrollLeft = pillsEl.scrollWidth; } catch (e) {}
      syncFade();
    });
  }
  function syncFade() {
    fadeEl.style.opacity = pillsEl.scrollLeft > 2 ? '1' : '0';
  }
  function updatePillStyles() {
    Array.prototype.forEach.call(pillsEl.querySelectorAll('.pill'), function (btn) {
      var k = parseInt(btn.getAttribute('data-idx'), 10);
      var d = days[k];
      var active = k === state.idx;
      btn.style.background = active ? 'var(--accent)' : 'var(--surface)';
      btn.style.color = active ? '#ffffff' : (d.total === 0 ? 'var(--ink3)' : 'var(--ink2)');
      btn.style.boxShadow = active ? '0 6px 14px -6px rgba(0,0,0,0.35)' : '0 1px 2px rgba(13,31,28,0.06)';
    });
    var active = pillsEl.querySelector('[data-idx="' + state.idx + '"]');
    if (active) {
      try {
        pillsEl.scrollTo({ left: Math.max(0, active.offsetLeft - pillsEl.clientWidth / 2 + active.offsetWidth / 2), behavior: 'smooth' });
      } catch (e) {}
    }
  }

  // ---- Chart (axis + bars), isolated so a resize can refresh it without retriggering entrance animations ----
  // ---- Scale: a pure function of the visible WINDOW, never of scroll pixels.
  // That indirection is what charting libraries (ECharts dataZoom, Highstock,
  // TradingView autoScale) all share: gestures move a window, the scale is
  // derived from the window's data. Scroll position is only how the window is
  // worked out here.
  //
  // Recomputed when the scroll SETTLES, not on every scroll event - a trackpad
  // fires one every few pixels, and an axis relabelling several times per
  // gesture reads as broken. Same reason chartjs-plugin-zoom rescales in
  // onPanComplete rather than continuously.

  var MIN_PEAK = 1000;      // 39 of the 60 retained days are empty; without a
                            // floor, scrolling into them divides by zero and
                            // labels the axis 0 / 0 / 0.
  var scalePeak = null;     // the peak the axis currently shows
  var scaleRaf = null, settleTimer = null;

  function reduceMotion() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  // Which bars the viewport covers. Partially visible bars COUNT: excluding a
  // half-scrolled-in bar that happens to be the tallest would let it render
  // past the top of its own axis.
  function visiblePeak(plot) {
    var bars = plot.querySelectorAll('.bar');
    if (!bars.length) return niceCeil(MIN_PEAK);
    var step = bars.length > 1 ? (bars[1].offsetLeft - bars[0].offsetLeft) : bars[0].offsetWidth;
    if (!step) return niceCeil(MIN_PEAK);

    var first = Math.max(0, Math.floor(plot.scrollLeft / step));
    var last = Math.min(bars.length - 1, Math.ceil((plot.scrollLeft + plot.clientWidth) / step) - 1);
    var max = 0;
    for (var i = first; i <= Math.max(first, last); i++) {
      var total = parseFloat(bars[i].getAttribute('data-total')) || 0;
      if (total > max) max = total;
    }
    return niceCeil(Math.max(MIN_PEAK, max));
  }

  function setAxisText(v) {
    var spans = document.querySelectorAll('#s-chartWrap .axis span');
    if (spans.length < 2) return;
    spans[0].textContent = compact(v);
    spans[1].textContent = compact(v / 2);
  }

  // The labels have to travel with the bars; numbers hard-swapping under bars
  // that are still moving reads as a glitch rather than a rescale.
  function tweenAxis(from, to, instant) {
    if (scaleRaf) cancelAnimationFrame(scaleRaf);
    if (instant || from === null || reduceMotion()) { setAxisText(to); return; }
    var start = null, dur = 280;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      setAxisText(from + (to - from) * e);
      if (p < 1) scaleRaf = requestAnimationFrame(step);
    }
    scaleRaf = requestAnimationFrame(step);
  }

  function applyScale(peak, instant) {
    var plot = document.getElementById('s-chartPlot');
    if (!plot) return;
    Array.prototype.forEach.call(plot.querySelectorAll('.bar'), function (barEl) {
      var total = parseFloat(barEl.getAttribute('data-total')) || 0;
      barEl.querySelector('.barfill').style.height = Math.min(100, total / peak * 100) + '%';
    });
    tweenAxis(scalePeak, peak, instant);
    scalePeak = peak;
  }

  function settleScale(instant) {
    clearTimeout(settleTimer);
    var plot = document.getElementById('s-chartPlot');
    if (!plot) return;
    var peak = visiblePeak(plot);
    if (peak !== scalePeak) applyScale(peak, instant);
  }

  function scheduleSettle() {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function () { settleScale(false); }, 120);
  }

  function computeBars() {
    var rawPeak = Math.max(1, Math.max.apply(null, days.map(function (d) { return d.total; })));
    var peak = niceCeil(rawPeak);
    var bars = days.slice().reverse().map(function (d) {   // oldest left, today right
      return {
        k: d.k, label: String(d.dn), total: d.total,
        h: Math.max(0, d.total / peak * 100),
        sel: d.k === state.idx
      };
    });
    return { peak: peak, bars: bars };
  }

  function barHtml(b) {
    return '<div class="bar" data-k="' + b.k + '" data-total="' + b.total + '">' +
      '<div class="barcol"><div class="barfill" style="height:' + b.h + '%;background:' + (b.sel ? 'var(--accent)' : 'var(--ink3)') + ';opacity:' + (b.sel ? 1 : 0.32) + '"></div></div>' +
      '<div class="barlbl">' + (b.sel ? '<span class="disc">' + b.label + '</span>' : b.label) + '</div>' +
      '</div>';
  }

  // The bars never change once the data has loaded, so the markup is built
  // once and a day change only patches the highlight - no re-render, no
  // re-animation, and the scroll position survives.
  function renderChart() {
    var c = computeBars();
    var chartEl = document.getElementById('s-chartWrap');
    var plot = document.getElementById('s-chartPlot');

    if (!plot) {
      var axisHtml = '<div class="axis"><span style="top:0">' + compact(c.peak) + '</span><span style="top:50%">' + compact(c.peak / 2) + '</span><span style="top:100%">0</span></div>';
      var barsHtml = c.bars.map(barHtml).join('');
      chartEl.innerHTML = axisHtml +
        '<div class="plotwrap">' +
          '<div class="grid"><i style="top:0"></i><i style="top:50%"></i><i style="top:100%"></i></div>' +
          '<div class="plot" id="s-chartPlot">' + barsHtml + '</div>' +
        '</div>';
      plot = document.getElementById('s-chartPlot');
      plot.scrollLeft = plot.scrollWidth; // open on today, at the right-hand end

      // scrollend where supported; the debounce is both the fallback and the
      // safety net for scrolls that never fire it (a programmatic scrollTo).
      plot.addEventListener('scroll', scheduleSettle, { passive: true });
      if ('onscrollend' in window) {
        plot.addEventListener('scrollend', function () { settleScale(false); });
      }
      window.addEventListener('resize', scheduleSettle);

      // Fit to what today's viewport actually shows, before the first paint.
      settleScale(true);
    } else {
      c.bars.forEach(function (b) {
        var barEl = plot.querySelector('.bar[data-k="' + b.k + '"]');
        if (!barEl) return;
        barEl.querySelector('.barfill').style.background = b.sel ? 'var(--accent)' : 'var(--ink3)';
        barEl.querySelector('.barfill').style.opacity = b.sel ? 1 : 0.32;
        barEl.querySelector('.barlbl').innerHTML = b.sel ? '<span class="disc">' + b.label + '</span>' : b.label;
      });
    }
    scrollBarIntoView();
  }

  // Keep the selected day reachable: picking a date from the pills, or swiping,
  // can select a bar that is scrolled out of sight.
  function scrollBarIntoView() {
    var plot = document.getElementById('s-chartPlot');
    var bar = plot && plot.querySelector('.bar[data-k="' + state.idx + '"]');
    if (!bar) return;
    var target = bar.offsetLeft - plot.clientWidth / 2 + bar.offsetWidth / 2;
    target = Math.max(0, Math.min(target, plot.scrollWidth - plot.clientWidth));
    try { plot.scrollTo({ left: target, behavior: 'smooth' }); }
    catch (e) { plot.scrollLeft = target; }
  }

  // ---- Persistent app shell, built once; day changes patch it in place ----
  function buildApp() {
    contentEl.innerHTML =
      '<div class="card hero">' +
        '<div class="total"><span class="cur">MVR</span><span id="s-heroValue">0</span></div>' +
        '<div class="delta" id="s-deltaBlock" style="display:none">' +
          '<svg width="14" height="14" fill="none" stroke="currentColor" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M7 12V2M2.5 6.5L7 2l4.5 4.5"></path></svg>' +
          '<span></span>' +
        '</div>' +
        '<div class="chart" id="s-chartWrap"></div>' +
      '</div>' +
      '<div class="card list">' +
        '<div class="listhead">' +
          '<span class="listtitle" id="s-listTitle">Paid for</span>' +
          '<span class="seg" role="tablist" aria-label="How to list the day">' +
            '<button type="button" role="tab" id="s-tabInvoices" data-view="invoices" aria-controls="s-listRows">Invoices</button>' +
            '<button type="button" role="tab" id="s-tabProducts" data-view="products" aria-controls="s-listRows">Products</button>' +
          '</span>' +
        '</div>' +
        '<div class="rows" id="s-listRows" role="tabpanel"></div>' +
      '</div>';

    contentEl.addEventListener('click', function (e) {
      var bar = e.target.closest('.bar');
      if (bar) { go(parseInt(bar.getAttribute('data-k'), 10)); return; }

      var tab = e.target.closest('.seg button');
      if (tab) { setView(tab.getAttribute('data-view')); return; }

      var row = e.target.closest('.row.has');
      if (row) setExpanded(row, row.getAttribute('aria-expanded') !== 'true');
    });

    // Left/right already move between days, so the tablist takes up/down.
    contentEl.addEventListener('keydown', function (e) {
      if (!e.target.closest || !e.target.closest('.seg')) return;
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      setView(state.view === 'products' ? 'invoices' : 'products');
      var sel = appEl.querySelector('.seg button[aria-selected="true"]');
      if (sel) sel.focus();
    });
  }

  function renderDay() {
    var day = days[state.idx];
    daynameEl.textContent = day.wd;
    daydateEl.textContent = day.dateFull;

    countUp(state.shown, day.total);
    state.shown = day.total;

    var prev = days[state.idx + 1];
    var deltaEl = document.getElementById('s-deltaBlock');
    if (prev && prev.total > 0 && day.total > 0) {
      var pct = (day.total - prev.total) / prev.total * 100;
      var up = pct >= 0;
      deltaEl.style.display = '';
      deltaEl.style.color = up ? 'var(--accent)' : 'var(--ink2)';
      deltaEl.querySelector('svg').style.transform = 'rotate(' + (up ? 0 : 180) + 'deg)';
      deltaEl.querySelector('span').textContent = (up ? '+' : '−') + Math.abs(pct).toFixed(1) + '% vs ' + (state.idx === 0 ? 'yesterday' : prev.wd.slice(0, 3));
    } else {
      deltaEl.style.display = 'none';
    }

    renderChart();

    renderList();
    updatePillStyles();
  }

  // ---- The list, in whichever of its two readings is selected ----
  var rowSeq = 0;

  function setView(view) {
    if (view !== 'products' && view !== 'invoices') return;
    if (view === state.view) return;
    state.view = view;
    saveView(view);
    renderList();
  }

  function productRowHtml(p, i, pr) {
    var badgeBg = i === 0 ? 'var(--accent)' : 'var(--muted)';
    var badgeFg = i === 0 ? '#ffffff' : 'var(--ink2)';
    var delay = Math.min(i, 12) * 35 + 'ms';
    return '<div class="row" style="animation: s-rise-' + pr + ' 320ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '">' +
      '<span class="rank" style="background:' + badgeBg + ';color:' + badgeFg + '">' + (i + 1) + '</span>' +
      '<span class="pname"><span class="pn">' + escapeHtml(p.name) + '</span><span class="pq">' + fmt(p.qty) + (p.qty === 1 ? ' unit' : ' units') + '</span></span>' +
      '<span class="pt">' + fmt(p.total) + '</span>' +
      '</div>';
  }

  function lineHtml(l) {
    return '<div class="lrow">' +
      '<span class="lname">' + escapeHtml(stripCode(l.name)) + '</span>' +
      '<span class="lqty">' + (Math.round(l.qty * 100) / 100) + '</span>' +
      '<span class="ltot">' + fmt(l.total) + '</span>' +
      '</div>';
  }

  function invoiceRowHtml(tx, i, pr) {
    var anon = !tx.customer || tx.customer === 'Walk-in';
    var lines = tx.lines || [];
    var has = lines.length > 0;
    var id = 's-lines-' + (++rowSeq);
    var tag = has ? 'button' : 'div';
    var delay = Math.min(i, 12) * 35 + 'ms';

    var head = '<' + tag + ' class="row' + (has ? ' has' : '') + '"' +
      (has ? ' type="button" aria-expanded="false" aria-controls="' + id + '"' : '') + '>' +
      '<span class="ref">' + escapeHtml(tx.ref || '\u2014') + '</span>' +
      '<span class="cust' + (anon ? ' anon' : '') + '">' + escapeHtml(tx.customer || 'Walk-in') + '</span>' +
      '<span class="pt">' + fmt(tx.amount) + '</span>' +
      (has
        ? '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>'
        : '') +
      '</' + tag + '>';

    var detail = has
      ? '<div class="detailwrap" id="' + id + '" aria-hidden="true"><div class="detailclip"><div class="detail">' +
          '<div class="lhead"><span class="lname">Product</span><span class="lqty">Qty</span><span class="ltot">Total</span></div>' +
          lines.map(lineHtml).join('') +
        '</div></div></div>'
      : '';

    return '<div class="item" style="animation: s-rise-' + pr + ' 320ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '">' +
      head + detail + '</div>';
  }

  function setExpanded(row, open) {
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    var wrap = document.getElementById(row.getAttribute('aria-controls'));
    if (!wrap) return;
    wrap.classList.toggle('open', open);
    wrap.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  function renderList() {
    var day = days[state.idx];
    var rowsEl = document.getElementById('s-listRows');
    if (!day || !rowsEl) return;
    var pr = parity();
    var invoices = state.view === 'invoices';

    Array.prototype.forEach.call(appEl.querySelectorAll('.seg button'), function (btn) {
      var on = btn.getAttribute('data-view') === state.view;
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.setAttribute('tabindex', on ? '0' : '-1');
    });

    if (invoices) {
      // Old day entries predate the pipeline carrying transactions; say so
      // rather than showing an empty card that reads as "nothing was sold".
      rowsEl.innerHTML = day.transactions.length
        ? day.transactions.map(function (tx, i) { return invoiceRowHtml(tx, i, pr); }).join('')
        : '<div class="emptylist">' + (day.total > 0
            ? 'No per-invoice detail recorded for this day.'
            : 'Nothing was received on this day.') + '</div>';
    } else {
      rowsEl.innerHTML = day.products.length
        ? day.products.map(function (p, i) { return productRowHtml(p, i, pr); }).join('')
        : '<div class="emptylist">Nothing was received on this day.</div>';
    }
  }

  // ---- Boot ----
  function showMessage(msg) {
    appEl.querySelector('.shell').innerHTML ='<div class="state-msg">' + escapeHtml(msg) + '</div>';
  }

  var DATA_URL = 'https://raw.githubusercontent.com/yuki-uthman/ike-data/main/data/sales.json';

  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (payload) {
      var rawDays = payload.days || [];
      if (!rawDays.length) {
        showMessage('No sales data yet — the first automatic refresh hasn’t run.');
        return;
      }
      days = buildViewDays(rawDays);
      buildPills();
      buildApp();
      state.idx = 0;
      // Quotations may have loaded first and already moved the shared day.
      days.forEach(function (d) { if (d.date === ikeDay.get()) state.idx = d.k; });
      renderDay();
    })
    .catch(function (err) {
      showMessage('Could not load sales data (' + err.message + '). Try refreshing in a minute.');
    });
})();
</script>
<script>
(function () {
  var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  var DATA_URL = 'https://raw.githubusercontent.com/yuki-uthman/ike-data/main/data/quotations.json';
  var REFRESH_MS = 60000; // ike-data itself refreshes every 15 min; this just keeps the page honest
  var STORE_KEY = 'ike-quotations:dismissed';

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function compact(n) {
    if (n < 1000) return fmt(n);
    var k = n / 1000;
    return (Math.round(k * 10) / 10).toString().replace(/\.0$/, '') + 'k';
  }
  function niceCeil(n) {
    var exp = Math.pow(10, Math.floor(Math.log10(n)));
    var f = n / exp, steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) { if (steps[i] >= f) return steps[i] * exp; }
    return 10 * exp;
  }
  // Odoo carries the internal reference inside the product name: "[PP9] PAPER PLATE 9"".
  function stripCode(name) { return String(name).replace(/^\[[^\]]*\]\s*/, '').trim(); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function parseDay(s) { return new Date(s + 'T00:00:00Z'); }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }

  // ---- Dismissals. Browser-local by design: Odoo is never touched, and a
  // dismissal made here is invisible to any other device. Every access is
  // guarded - a private window or blocked site data throws on read. ----
  var dismissed = {};
  function loadDismissed() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return {};
      var arr = JSON.parse(raw), out = {};
      if (Object.prototype.toString.call(arr) === '[object Array]') {
        arr.forEach(function (ref) { out[ref] = true; });
      }
      return out;
    } catch (e) { return {}; }
  }
  function saveDismissed() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(Object.keys(dismissed))); } catch (e) {}
  }

  var payload = null;
  var VIEW_KEY = 'ike-quotations-view';
  function loadView() {
    try { return localStorage.getItem(VIEW_KEY) === 'products' ? 'products' : 'records'; }
    catch (e) { return 'records'; }   // private window, blocked storage
  }
  function saveView(v) { try { localStorage.setItem(VIEW_KEY, v); } catch (e) {} }

  var state = { day: null, showBin: false, tick: 0, view: loadView() };
  var chartDayKey = null, builtDayKey = null;

  var pillsEl = document.getElementById('q-pills');
  var allPillEl = document.getElementById('q-allpill');
  var fadeEl = document.getElementById('q-fade');
  var daynameEl = document.getElementById('q-dayname');
  var daydateEl = document.getElementById('q-daydate');
  var stampEl = document.getElementById('q-stamp');
  var heroValueEl = document.getElementById('q-heroValue');
  var sublineEl = document.getElementById('q-subline');
  var viewSegEl = document.getElementById('q-viewSeg');
  var chartWrapEl = document.getElementById('q-chartWrap');
  var contentEl = document.getElementById('q-content');
  var binEl = document.getElementById('q-bin');

  function live() {
    return (payload.quotations || []).filter(function (q) { return !dismissed[q.ref]; });
  }
  function binned() {
    return (payload.quotations || []).filter(function (q) { return dismissed[q.ref]; });
  }
  function selected() {
    var rows = live();
    if (!state.day) return rows;
    return rows.filter(function (q) { return q.date === state.day; });
  }
  // Day totals are recomputed from the live rows rather than read from the
  // feed, so dismissing a lead updates its bar and its day total immediately.
  function dayTotals() {
    var byDay = {};
    live().forEach(function (q) {
      if (!q.date) return;
      var t = byDay[q.date] || (byDay[q.date] = { count: 0, outstanding: 0 });
      t.count++; t.outstanding += q.outstanding;
    });
    return (payload.days || []).map(function (d) {
      var t = byDay[d.date] || { count: 0, outstanding: 0 };
      return { date: d.date, count: t.count, outstanding: t.outstanding };
    });
  }
  function sum(rows) { return rows.reduce(function (s, q) { return s + q.outstanding; }, 0); }

  // ---- Pills ----
  function buildPills() {
    pillsEl.innerHTML = (payload.days || []).map(function (d) {
      var dt = parseDay(d.date);
      var label = d.date === todayKey() ? 'Today' : DAYN[dt.getUTCDay()].slice(0, 3) + ' ' + dt.getUTCDate();
      return '<button class="pill" type="button" data-day="' + d.date + '">' + escapeHtml(label) + '</button>';
    }).join('');
    requestAnimationFrame(function () {
      try { pillsEl.scrollLeft = pillsEl.scrollWidth; } catch (e) {}
      syncFade();
    });
  }
  function lastDayKey(data) {
    var days = (data && data.days) || [];
    return days.length ? days[days.length - 1].date : null;
  }
  function todayKey() { return lastDayKey(payload); }
  function syncFade() { fadeEl.style.opacity = pillsEl.scrollLeft > 2 ? '1' : '0'; }
  function updatePills() {
    var totals = {};
    dayTotals().forEach(function (d) { totals[d.date] = d.count; });
    allPillEl.style.background = state.day ? 'var(--surface)' : 'var(--accent)';
    allPillEl.style.color = state.day ? 'var(--ink2)' : '#ffffff';
    allPillEl.style.boxShadow = state.day ? '0 1px 2px rgba(13,31,28,0.06)' : '0 6px 14px -6px rgba(0,0,0,0.35)';
    Array.prototype.forEach.call(pillsEl.querySelectorAll('.pill'), function (btn) {
      var day = btn.getAttribute('data-day');
      var active = day === state.day;
      btn.style.background = active ? 'var(--accent)' : 'var(--surface)';
      btn.style.color = active ? '#ffffff' : (totals[day] ? 'var(--ink2)' : 'var(--ink3)');
      btn.style.boxShadow = active ? '0 6px 14px -6px rgba(0,0,0,0.35)' : '0 1px 2px rgba(13,31,28,0.06)';
    });
    if (state.day) {
      var active = pillsEl.querySelector('[data-day="' + state.day + '"]');
      if (active) {
        try {
          pillsEl.scrollTo({ left: Math.max(0, active.offsetLeft - pillsEl.clientWidth / 2 + active.offsetWidth / 2), behavior: 'smooth' });
        } catch (e) {}
      }
    }
  }

  // ---- Chart. Every day in the feed is a bar and the plot scrolls; the axis
  // fits whichever bars are on screen. ----

  // Scale: a pure function of the visible WINDOW, never of scroll pixels. That
  // indirection is what the charting libraries (ECharts dataZoom, Highstock,
  // TradingView autoScale) all share - gestures move a window, the scale is
  // derived from the window's data. Scroll position is only how the window is
  // worked out here.
  //
  // Recomputed when the scroll SETTLES, not per scroll event: a trackpad fires
  // one every few pixels, and an axis relabelling several times in a gesture
  // reads as broken. chartjs-plugin-zoom rescales in onPanComplete likewise.
  var MIN_PEAK = 1000;      // floor, so a window of fully-settled days cannot
                            // divide by zero or label the axis 0 / 0 / 0
  var scalePeak = null;
  var scaleRaf = null, settleTimer = null;

  function reduceMotion() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  // Partially visible bars COUNT: excluding a half-scrolled-in bar that happens
  // to be the tallest would let it render past the top of its own axis.
  function visiblePeak(plot) {
    var bars = plot.querySelectorAll('.bar');
    if (!bars.length) return niceCeil(MIN_PEAK);
    var step = bars.length > 1 ? (bars[1].offsetLeft - bars[0].offsetLeft) : bars[0].offsetWidth;
    if (!step) return niceCeil(MIN_PEAK);
    var first = Math.max(0, Math.floor(plot.scrollLeft / step));
    var last = Math.min(bars.length - 1, Math.ceil((plot.scrollLeft + plot.clientWidth) / step) - 1);
    var max = 0;
    for (var i = first; i <= Math.max(first, last); i++) {
      var total = parseFloat(bars[i].getAttribute('data-total')) || 0;
      if (total > max) max = total;
    }
    return niceCeil(Math.max(MIN_PEAK, max));
  }

  function setAxisText(v) {
    var spans = chartWrapEl.querySelectorAll('.axis span');
    if (spans.length < 2) return;
    spans[0].textContent = compact(v);
    spans[1].textContent = compact(v / 2);
  }

  // The labels travel with the bars; numbers hard-swapping under bars still in
  // motion reads as a glitch rather than a rescale.
  function tweenAxis(from, to, instant) {
    if (scaleRaf) cancelAnimationFrame(scaleRaf);
    if (instant || from === null || reduceMotion()) { setAxisText(to); return; }
    var start = null, dur = 280;
    function step(ts) {
      if (start === null) start = ts;
      var pr = Math.min(1, (ts - start) / dur);
      var e = 1 - Math.pow(1 - pr, 3);
      setAxisText(from + (to - from) * e);
      if (pr < 1) scaleRaf = requestAnimationFrame(step);
    }
    scaleRaf = requestAnimationFrame(step);
  }

  function applyScale(peak, instant) {
    var plot = document.getElementById('q-chartPlot');
    if (!plot) return;
    Array.prototype.forEach.call(plot.querySelectorAll('.bar'), function (el) {
      var total = parseFloat(el.getAttribute('data-total')) || 0;
      el.querySelector('.barfill').style.height = Math.min(100, total / peak * 100) + '%';
    });
    tweenAxis(scalePeak, peak, instant);
    scalePeak = peak;
  }

  // force: a refresh can move the amounts without moving the peak, and those
  // bars still have to be repainted.
  function settleScale(instant, force) {
    clearTimeout(settleTimer);
    var plot = document.getElementById('q-chartPlot');
    if (!plot) return;
    var peak = visiblePeak(plot);
    if (force || peak !== scalePeak) applyScale(peak, instant);
  }

  function scheduleSettle() {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function () { settleScale(false); }, 120);
  }

  function scrollBarIntoView() {
    var plot = document.getElementById('q-chartPlot');
    if (!plot || !state.day) return;
    var bar = plot.querySelector('.bar[data-day="' + state.day + '"]');
    if (!bar) return;
    var target = bar.offsetLeft - plot.clientWidth / 2 + bar.offsetWidth / 2;
    target = Math.max(0, Math.min(target, plot.scrollWidth - plot.clientWidth));
    try { plot.scrollTo({ left: target, behavior: 'smooth' }); }
    catch (e) { plot.scrollLeft = target; }
  }

  function computeBars() {
    return dayTotals().map(function (d) {
      return {
        date: d.date,
        label: String(parseDay(d.date).getUTCDate()),
        total: d.outstanding,
        sel: !state.day || d.date === state.day
      };
    });
  }

  // Markup is rebuilt only when the SET OF DAYS changes - not on every refresh,
  // which used to replay the grow-in animation and throw away the scroll
  // position once a minute. A changed amount patches in place instead.
  function renderChart() {
    var bars = computeBars();
    var dayKey = bars.map(function (b) { return b.date; }).join(',');
    var plot = document.getElementById('q-chartPlot');

    if (!plot || dayKey !== chartDayKey) {
      chartWrapEl.innerHTML =
        '<div class="axis"><span style="top:0"></span>' +
        '<span style="top:50%"></span><span style="top:100%">0</span></div>' +
        '<div class="plotwrap">' +
          '<div class="gridlines"><i style="top:0"></i><i style="top:50%"></i><i style="bottom:0"></i></div>' +
          '<div class="plot" id="q-chartPlot">' +
          bars.map(function (b) {
            var dt = parseDay(b.date);
            var title = DAYN[dt.getUTCDay()] + ' ' + dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()];
            return '<button class="bar" type="button" data-day="' + b.date + '" data-total="' + b.total + '" aria-label="' + escapeHtml(title) + '">' +
              '<div class="barcol"><div class="barfill"></div></div>' +
              '<div class="barlbl"></div></button>';
          }).join('') +
          '</div>' +
        '</div>';
      chartDayKey = dayKey;
      plot = document.getElementById('q-chartPlot');
      plot.scrollLeft = plot.scrollWidth;   // open on today, at the right-hand end

      // scrollend where supported; the debounce is both the fallback and the
      // safety net for scrolls that never fire it (a programmatic scrollTo).
      plot.addEventListener('scroll', scheduleSettle, { passive: true });
      if ('onscrollend' in window) {
        plot.addEventListener('scrollend', function () { settleScale(false); });
      }
      window.addEventListener('resize', scheduleSettle);

      // Heights start unset, so this first pass grows them in from zero.
      requestAnimationFrame(function () { settleScale(true, true); paintBars(bars); });
      return;
    }

    bars.forEach(function (b) {
      var el = plot.querySelector('.bar[data-day="' + b.date + '"]');
      if (el) el.setAttribute('data-total', b.total);
    });
    settleScale(false, true);
    paintBars(bars);
    scrollBarIntoView();
  }

  // Heights belong to the scale now; this owns only selection and labels.
  function paintBars(bars) {
    var plot = document.getElementById('q-chartPlot');
    if (!plot) return;
    bars.forEach(function (b) {
      var el = plot.querySelector('.bar[data-day="' + b.date + '"]');
      if (!el) return;
      el.querySelector('.barfill').style.opacity = b.sel ? 1 : 0.3;
      el.querySelector('.barlbl').innerHTML = (state.day && b.date === state.day)
        ? '<span class="disc">' + b.label + '</span>' : b.label;
    });
  }

  // ---- Rows ----
  var rowSeq = 0;
  function lineHtml(l) {
    return '<div class="lrow">' +
      '<span class="lname">' + escapeHtml(stripCode(l.name)) + '</span>' +
      '<span class="lqty">' + (Math.round(l.qty * 100) / 100) + '</span>' +
      '<span class="ltot">' + fmt(l.total) + '</span>' +
      '</div>';
  }
  function ageText(q) {
    var today = todayKey();
    if (!q.date || !today) return '';
    var n = daysBetween(parseDay(q.date), parseDay(today));
    if (n <= 0) return 'today';
    if (n === 1) return 'yesterday';
    return n + ' days ago';
  }
  function expiryTag(q) {
    if (q.kind !== 'quotation' || !q.expires) return '';
    var today = todayKey();
    if (!today) return '';
    var n = daysBetween(parseDay(today), parseDay(q.expires));
    if (n < 0) return '<span class="tag expired">Expired</span>';
    if (n <= 7) return '<span class="tag expired">Expires in ' + n + 'd</span>';
    return '';
  }
  function rowHtml(q, i, animClass) {
    var id = 'q-lines-' + (++rowSeq);
    var lines = q.lines || [];
    var dt = q.date ? parseDay(q.date) : null;
    var dateLabel = dt ? dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()].slice(0, 3) : '—';
    var part = q.settled > 0
      ? '<span class="sep">·</span><span class="tag part">Part paid</span>' : '';
    var expiry = expiryTag(q);
    var meta = '<div class="meta"><span>' + escapeHtml(dateLabel) + '</span>' +
      '<span class="sep">·</span><span>' + escapeHtml(ageText(q)) + '</span>' + part +
      (expiry ? '<span class="sep">·</span>' + expiry : '') + '</div>';

    var head = '<button class="row" type="button" aria-expanded="false" aria-controls="' + id + '" data-ref="' + escapeHtml(q.ref) + '">' +
      '<span class="who">' +
        '<span class="whotop"><span class="ref">' + escapeHtml(q.ref) + '</span>' +
        '<span class="cust">' + escapeHtml(q.customer || 'No customer') + '</span></span>' +
        meta +
      '</span>' +
      '<span class="amtwrap"><span class="amt">' + fmt(q.outstanding) + '</span>' +
        (q.settled > 0 ? '<span class="amtof">of ' + fmt(q.total) + '</span>' : '') +
      '</span>' +
      '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>' +
      '</button>';

    var body = lines.length
      ? '<div class="lhead"><span class="lname">Product</span><span class="lqty">Qty</span><span class="ltot">Total</span></div>' + lines.map(lineHtml).join('')
      : '<div class="lrow"><span class="lname">No product lines on this record.</span></div>';

    var detail = '<div class="detailwrap" id="' + id + '" aria-hidden="true"><div class="detailclip"><div class="detail">' +
      body +
      '<div class="detailfoot">' +
        '<span class="by">' + (q.salesperson ? 'Raised by ' + escapeHtml(q.salesperson) : '&nbsp;') + '</span>' +
        '<button class="drop" type="button" data-drop="' + escapeHtml(q.ref) + '">Not interested <span class="x" aria-hidden="true">×</span></button>' +
      '</div>' +
      '</div></div></div>';

    var style = animClass
      ? ' style="animation: ' + animClass + ' 300ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + (Math.min(i, 12) * 30) + 'ms"'
      : '';
    return '<div class="item"' + style + '>' + head + detail + '</div>';
  }

  // What is sitting inside these records, aggregated by product. Note this
  // totals the LINES, which for a part-paid record is more than the amount
  // still owing above it - the card total is money outstanding, a product line
  // is the whole thing that was ordered. Rare here, and the "Part paid" tag in
  // the records view is where that shows.
  function productsIn(rows) {
    var agg = {};
    rows.forEach(function (q) {
      (q.lines || []).forEach(function (l) {
        var name = stripCode(l.name);
        var a = agg[name] || (agg[name] = { name: name, qty: 0, total: 0 });
        a.qty += l.qty; a.total += l.total;
      });
    });
    return Object.keys(agg).map(function (n) { return agg[n]; })
      .sort(function (a, b) { return b.total - a.total || a.name.localeCompare(b.name); });
  }

  function productRowHtml(p, i, animClass, swatch) {
    var delay = Math.min(i, 12) * 30 + 'ms';
    var anim = animClass
      ? ' style="animation: ' + animClass + ' 300ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '"'
      : '';
    var badge = i === 0
      ? ' style="background:' + swatch + ';color:#ffffff"'
      : '';
    return '<div class="prow"' + anim + '>' +
      '<span class="rank"' + badge + '>' + (i + 1) + '</span>' +
      '<span class="pname"><span class="pn">' + escapeHtml(p.name) + '</span>' +
      '<span class="pq">' + fmt(p.qty) + (p.qty === 1 ? ' unit' : ' units') + '</span></span>' +
      '<span class="pt">' + fmt(p.total) + '</span>' +
      '</div>';
  }

  function cardHtml(title, swatch, rows, animClass) {
    var products = state.view === 'products' ? productsIn(rows) : null;
    var n = products ? products.length : rows.length;
    var noun = products
      ? (n === 1 ? ' product' : ' products')
      : (n === 1 ? ' record' : ' records');
    var body;
    if (!rows.length) {
      body = '<div class="empty">Nothing open here' + (state.day ? ' on this day' : '') + '.</div>';
    } else if (products) {
      body = products.length
        ? products.map(function (p, i) { return productRowHtml(p, i, animClass, swatch); }).join('')
        : '<div class="empty">No product lines on these records.</div>';
    } else {
      body = rows.map(function (q, i) { return rowHtml(q, i, animClass); }).join('');
    }
    return '<div class="card">' +
      '<div class="cardhead">' +
        '<div class="headrow">' +
          '<span class="kind"><span class="swatch" style="background:' + swatch + '"></span>' + title + '</span>' +
          '<span class="count">' + n + noun + '</span>' +
        '</div>' +
        '<div class="cardtotal"><span class="cur">MVR</span><span>' + fmt(sum(rows)) + '</span></div>' +
      '</div>' +
      '<div class="rows">' + body + '</div>' +
      '</div>';
  }

  function renderBin() {
    var rows = binned();
    if (!rows.length) { binEl.innerHTML = ''; state.showBin = false; return; }
    var html = '<div class="binbar"><span><b>' + rows.length + '</b> dismissed' +
      ' — hidden here only, still open in Odoo.</span>' +
      '<button class="linkbtn" type="button" id="q-binToggle">' + (state.showBin ? 'Hide' : 'Show') + '</button></div>';
    if (state.showBin) {
      html += '<div class="card" style="margin-top:10px"><div class="rows"><div class="binlist">' +
        rows.map(function (q) {
          var dt = q.date ? parseDay(q.date) : null;
          return '<div class="binrow">' +
            '<span class="ref">' + escapeHtml(q.ref) + '</span>' +
            '<span class="cust">' + escapeHtml(q.customer || 'No customer') + '</span>' +
            '<span class="meta">' + (dt ? dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()].slice(0, 3) : '—') + '</span>' +
            '<span class="amt">' + fmt(q.outstanding) + '</span>' +
            '<button class="linkbtn" type="button" data-restore="' + escapeHtml(q.ref) + '" style="margin-left:0">Restore</button>' +
            '</div>';
        }).join('') +
        '</div></div></div>';
    }
    binEl.innerHTML = html;
  }

  function render(animate) {
    var rows = selected();
    var quotes = rows.filter(function (q) { return q.kind === 'quotation'; });
    var orders = rows.filter(function (q) { return q.kind === 'order'; });
    var byValue = function (a, b) { return b.outstanding - a.outstanding; };
    quotes.sort(byValue); orders.sort(byValue);

    if (state.day) {
      var dt = parseDay(state.day);
      daynameEl.textContent = DAYN[dt.getUTCDay()];
      daydateEl.textContent = dt.getUTCDate() + ' ' + MON[dt.getUTCMonth()] + ' ' + dt.getUTCFullYear();
    } else {
      var days = payload.days || [];
      daynameEl.textContent = 'Still open';
      if (days.length) {
        var a = parseDay(days[0].date), b = parseDay(days[days.length - 1].date);
        daydateEl.textContent = a.getUTCDate() + ' ' + MON[a.getUTCMonth()].slice(0, 3) +
          ' – ' + b.getUTCDate() + ' ' + MON[b.getUTCMonth()].slice(0, 3) + ' ' + b.getUTCFullYear();
      } else { daydateEl.textContent = ''; }
    }

    heroValueEl.textContent = fmt(sum(rows));
    sublineEl.textContent = rows.length + (rows.length === 1 ? ' record' : ' records') +
      ' still owing · ' + quotes.length + ' quotation' + (quotes.length === 1 ? '' : 's') +
      ' · ' + orders.length + ' unpaid order' + (orders.length === 1 ? '' : 's');

    renderChart();
    updatePills();
    updateViewTabs();

    var open = openRowKeys();
    var animClass = animate ? ((++state.tick) % 2 ? 'q-rise-b' : 'q-rise-a') : null;
    rowSeq = 0;
    contentEl.innerHTML =
      cardHtml('Quotations', 'var(--accent)', quotes, animClass) +
      cardHtml('Unpaid orders', 'var(--order)', orders, animClass);
    restoreOpen(open);
    renderBin();
  }

  // A refresh every 60s must not slam shut a row the user is reading, so
  // remember which rows were open by their reference, not by position.
  function openRowKeys() {
    var keys = {};
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row[aria-expanded="true"]'), function (row) {
      keys[row.getAttribute('data-ref')] = true;
    });
    return keys;
  }
  function restoreOpen(keys) {
    Array.prototype.forEach.call(contentEl.querySelectorAll('.row'), function (row) {
      if (keys[row.getAttribute('data-ref')]) setExpanded(row, true, true);
    });
  }
  function setExpanded(row, open, instant) {
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    var wrap = document.getElementById(row.getAttribute('aria-controls'));
    if (!wrap) return;
    // Reopening a row after a refresh must not replay the animation, so skip
    // the transition for one frame, then hand it back for the next real click.
    if (instant) {
      wrap.classList.add('instant');
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { wrap.classList.remove('instant'); });
      });
    }
    wrap.classList.toggle('open', open);
    wrap.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  // ---- Interaction ----
  function selectDay(day) {
    state.day = day;
    render(true);
    if (day) ikeDay.set(day, 'quotes');
  }

  // Sales picked a day. Unlike Sales, this pane can show a date that is not in
  // its feed (everything raised that day has since settled): it then reads
  // "Nothing open here on this day" rather than silently staying elsewhere.
  ikeDay.on('quotes', function (date) {
    if (!payload || state.day === date) return;
    state.day = date;
    render(true);
  });
  function updateViewTabs() {
    Array.prototype.forEach.call(viewSegEl.querySelectorAll('button'), function (btn) {
      var on = btn.getAttribute('data-view') === state.view;
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.setAttribute('tabindex', on ? '0' : '-1');
    });
  }

  function setView(view) {
    if (view !== 'records' && view !== 'products') return;
    if (view === state.view) return;
    state.view = view;
    saveView(view);
    render(true);
  }

  viewSegEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) setView(btn.getAttribute('data-view'));
  });
  viewSegEl.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    setView(state.view === 'records' ? 'products' : 'records');
    var sel = viewSegEl.querySelector('button[aria-selected="true"]');
    if (sel) sel.focus();
  });

  allPillEl.addEventListener('click', function () { selectDay(null); });
  pillsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.pill');
    if (btn) selectDay(btn.getAttribute('data-day'));
  });
  pillsEl.addEventListener('scroll', syncFade);
  chartWrapEl.addEventListener('click', function (e) {
    var bar = e.target.closest('.bar');
    if (!bar) return;
    var day = bar.getAttribute('data-day');
    selectDay(day === state.day ? null : day);
  });
  contentEl.addEventListener('click', function (e) {
    var drop = e.target.closest('[data-drop]');
    if (drop) {
      dismissed[drop.getAttribute('data-drop')] = true;
      saveDismissed();
      render(false);
      return;
    }
    var row = e.target.closest('.row');
    if (row) setExpanded(row, row.getAttribute('aria-expanded') !== 'true');
  });
  binEl.addEventListener('click', function (e) {
    if (e.target.closest('#q-binToggle')) { state.showBin = !state.showBin; renderBin(); return; }
    var restore = e.target.closest('[data-restore]');
    if (restore) {
      delete dismissed[restore.getAttribute('data-restore')];
      saveDismissed();
      render(false);
    }
  });

  // ---- Boot ----
  function showMessage(msg) {
    document.getElementById('q-shell').innerHTML = '<div class="state-msg">' + escapeHtml(msg) + '</div>';
  }

  function load(isRefresh) {
    return fetch(DATA_URL, { cache: 'no-store' })
      .then(function (res) {
        if (res.status === 404) throw new Error('not-yet');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var first = payload === null;
        payload = data;
        if (data.generatedAt) {
          var g = new Date(data.generatedAt);
          if (!isNaN(g.getTime())) {
            stampEl.innerHTML = '<span class="dot"></span>updated ' +
              g.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Indian/Maldives' });
          }
        }
        if (first) {
          dismissed = loadDismissed();
          // Opens on today. "All" is one tap away on the pinned pill, and
          // clicking the selected bar again also returns to it.
          state.day = ikeDay.get() || lastDayKey(data);
        }
        var dayKey = (data.days || []).map(function (d) { return d.date; }).join(',');
        if (dayKey !== builtDayKey) {
          if (state.day && dayKey.indexOf(state.day) === -1) state.day = null; // it fell out of the feed
          builtDayKey = dayKey;
          chartDayKey = null;   // the day set moved - the bars must be rebuilt
          buildPills();
        }
        render(first);
      })
      .catch(function (err) {
        if (isRefresh) return;
        if (err.message === 'not-yet') {
          showMessage('No quotation data yet — run the “Refresh sales + expenses + today + quotations data” workflow in ike-data once to seed it.');
        } else {
          showMessage('Could not load open quotations (' + err.message + '). Try refreshing in a minute.');
        }
      });
  }

  load(false);
  setInterval(function () { load(true); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) load(true);
  });
})();
</script>
<script>
// ---- Expenses pane (V3: real data) ----
// Three regions, three named sources, so no figure has two authors: the day's
// totals and category rows come from ike-data's expenses.json (D11 does that
// counting, never this page), the entry list and its chips come from the
// Worker's GET /entries, and the Add sheet's category list from GET
// /categories. Nothing is ever shown as saved that the service did not confirm:
// a row is built only from a 200 answer's `entry`, and the list is re-read from
// the service rather than remembered here.
(function () {
  var EXPENSES_URL =
    'https://raw.githubusercontent.com/yuki-uthman/ike-data/main/data/expenses.json';
  var REFRESH_MS = 300000; // D11 rebuilds the feed every 15 minutes; a minute poll buys nothing.
  var RECEIPT_CAP_BYTES = 1000000; // the Worker's own declared cap.

  // D12's five words, mapped from the service's own word to the chip class. The
  // page invents no chip; an unrecognised word renders as neutral plain text.
  var CHIP_CLASS = {
    'Waiting to send': 'chip-queued',
    'Not sent': 'chip-failed',
    'Draft': 'chip-draft',
    'Approved': 'chip-approved',
    'Refused': 'chip-refused'
  };

  var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) {
    return n % 1 === 0
      ? n.toLocaleString('en-US')
      : n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  // D16: the Maldives (UTC+5) day, the same expression the Worker dates entries
  // by, so the day the page shows a new row on is the day the service filed it.
  function maldivesToday() {
    return new Date(Date.now() + 5 * 3600 * 1000).toISOString().slice(0, 10);
  }
  var TODAY = maldivesToday();

  function dayOf(date) {
    var p = String(date).split('-');
    return new Date(Date.UTC(+p[0], (+p[1]) - 1, +p[2]));
  }
  function pillLabel(date) {
    if (date === TODAY) return 'Today';
    var d = dayOf(date);
    return DAYN[d.getUTCDay()].slice(0, 3) + ' ' + d.getUTCDate();
  }
  function fullLabel(date) {
    var d = dayOf(date);
    return DAYN[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()];
  }

  // The page learns the service's base URL from one declarative line. A
  // loopback page — and only a loopback page — may override it with ?api=, so a
  // crafted https://…/?api=<attacker> link can never receive a typed PIN.
  function serviceBase() {
    var host = location.hostname;
