<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ike Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  /* An author display rule outranks the UA stylesheet's [hidden]{display:none},
     so .detail{display:flex} would otherwise render every row expanded. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #f4f7f6;
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-color-scheme: dark) { body { background: #0b1614; } }

  .app {
    --bg: #f4f7f6; --surface: #ffffff; --muted: #edf2f0; --ink: #0d1f1c; --ink2: #4c5f5b; --ink3: #7c8c88;
    --border: rgba(13,31,28,0.08); --grid: #e1e6e4;
    --accent: #0f6f68;
    --shadow: 0 1px 2px rgba(13,31,28,0.05), 0 12px 32px -16px rgba(13,31,28,0.22);
    height: 100vh; height: 100dvh;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; overflow: hidden; outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-color-scheme: dark) {
    .app {
      --bg: #0b1614; --surface: #11201d; --muted: #162622; --ink: #f2f6f5; --ink2: #b7c6c2; --ink3: #82938e;
      --border: rgba(255,255,255,0.08); --grid: #223330;
      --accent: #29b3a6;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 14px 32px -16px rgba(0,0,0,0.6);
    }
  }

  .shell { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px 10px; width: 100%; max-width: 1160px; margin: 0 auto; }
  .topbar { display: flex; flex-direction: column; gap: 12px; }
  .pillswrap { position: relative; min-width: 0; }
  .pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 4px 0; }
  .fade { position: absolute; top: 0; bottom: 0; left: 0; width: 96px; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(244,247,246,0) 100%); pointer-events: none; transition: opacity 0.25s; opacity: 0; }
  @media (prefers-color-scheme: dark) { .fade { background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 38%, rgba(11,22,20,0) 100%); } }
  .pills::-webkit-scrollbar { display: none; }
  .pill { flex: 0 0 auto; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; font-family: "Source Sans 3", system-ui, sans-serif; font-weight: 600; font-size: 13px; line-height: 1; cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s; }

  .daterow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 0; }
  .dayname { font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; line-height: 1.15; }
  .daydate { font-size: 13px; color: var(--ink2); margin-top: 2px; }

  .main { flex: 1; min-height: 0; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
  .content { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
  .hero { padding: 18px 18px 14px; display: flex; flex-direction: column; }
  .total { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; }
  .cur { font-size: 15px; font-weight: 700; color: var(--ink2); letter-spacing: 0.02em; }
  .delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 600; margin-top: 8px; }
  .chart { display: flex; align-items: stretch; gap: 10px; height: 150px; margin-top: 18px; }
  .axis { position: relative; flex: 0 0 30px; margin-top: 20px; margin-bottom: 19px; }
  .axis span { position: absolute; right: 0; transform: translateY(-50%); font-size: 10.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* The gridlines sit in this wrapper rather than in the scroller, so they
     stay put while the bars scroll under them - a gridline that scrolled away
     from its own axis label would be worse than no gridline. */
  .plotwrap { position: relative; flex: 1; min-width: 0; }
  /* The page swipes left/right to change day and declares touch-action: pan-y
     to allow it, which would leave this scroller unscrollable by touch. pan-x
     here hands horizontal gestures that start on the chart back to the
     scroller; the swipe handler ignores them for the same reason. */
  .plot { position: relative; height: 100%; display: flex; align-items: stretch; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-behavior: smooth; overscroll-behavior-x: contain; touch-action: pan-x; }
  .plot::-webkit-scrollbar { display: none; }
  .grid { position: absolute; left: 0; right: 0; top: 20px; bottom: 19px; pointer-events: none; }
  .grid i { position: absolute; left: 0; right: 0; height: 1px; background: var(--grid); font-style: normal; }
  .bar { position: relative; flex: 0 0 26px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
  .barcol { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .barfill { width: 70%; max-width: 30px; min-height: 3px; border-radius: 5px 5px 2px 2px; transition: height 280ms cubic-bezier(0.2, 0.8, 0.2, 1), background 0.2s ease, opacity 0.2s ease; }
  .barlbl { height: 28px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--ink3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .barlbl .disc { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: #ffffff; font-weight: 700; font-size: 12.5px; }
  .list { display: flex; flex-direction: column; min-height: 0; }
  .listhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 8px; }
  .listtitle { font-family: Manrope, sans-serif; font-weight: 700; font-size: 15px; }
  .count { font-size: 12.5px; color: var(--ink3); }

  /* Segmented control: both views describe the same money, so this swaps only
     what the card lists - the total, chart and pills above are untouched. */
  .seg { display: inline-flex; padding: 2px; background: var(--muted); border-radius: 999px; gap: 2px; flex: 0 0 auto; }
  .seg button { border: 0; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: none; color: var(--ink3); transition: background 180ms ease, color 180ms ease; }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(13,31,28,0.12); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---- invoice rows ---- */
  .item + .item > .row { box-shadow: inset 0 1px 0 var(--rule); }
  .row.has { cursor: pointer; width: 100%; font: inherit; color: inherit; background: none; border: 0; text-align: left; }
  .row.has:hover, .row.has[aria-expanded="true"] { background: var(--muted); box-shadow: none; }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ref { flex: 0 0 auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--ink3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cust { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cust.anon { font-weight: 400; color: var(--ink3); font-style: italic; }
  .chev { flex: 0 0 auto; color: var(--ink3); transition: transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1), color 200ms ease; transition: transform 420ms linear(0, 0.0693, 0.2322, 0.4328, 0.6312, 0.8028, 0.9356, 1.0269, 1.0807, 1.1039, 1.1052, 1.0924, 1.0726, 1.0508, 1.0307, 1.0141, 1.002, 0.9941, 0.9899, 0.9886, 0.9892, 0.991, 0.9933, 0.9956, 0.9976, 0.9991, 1), color 200ms ease; }
  .row[aria-expanded="true"] .chev { transform: rotate(180deg); color: var(--accent); }

  /* Animating to a height nothing has measured: the wrapper is a grid whose
     single row goes 0fr -> 1fr, which interpolates, unlike height:auto. The
     linear() curves are a damped spring sampled at 27 points; each is preceded
     by a cubic-bezier of roughly the same shape, so an engine that cannot parse
     linear() degrades rather than snapping. */
  .detailwrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 240ms cubic-bezier(0.45, 0, 0.7, 0.25); }
  .detailwrap.open {
    grid-template-rows: 1fr;
    transition: grid-template-rows 440ms cubic-bezier(0.34, 1.4, 0.64, 1);
    transition: grid-template-rows 440ms linear(0, 0.0506, 0.17, 0.3201, 0.4748, 0.6178, 0.7404, 0.8392, 0.9142, 0.9677, 1.0033, 1.0246, 1.0352, 1.0384, 1.0367, 1.0323, 1.0266, 1.0206, 1.0151, 1.0103, 1.0064, 1.0035, 1.0014, 1, 0.9991, 0.9987, 1);
  }
  .detailclip { overflow: hidden; min-height: 0; }
  .detail { margin: 2px 10px 8px; padding: 9px 12px 10px; background: var(--muted); border-radius: 11px; display: flex; flex-direction: column; gap: 5px; opacity: 0; transform: translateY(-9px) scale(0.985); transition: opacity 150ms ease, transform 260ms cubic-bezier(0.5, -0.2, 0.75, 0.4); }
  .detailwrap.open .detail {
    opacity: 1; transform: none;
    transition: opacity 200ms ease 30ms, transform 520ms cubic-bezier(0.34, 1.56, 0.64, 1);
    transition: opacity 200ms ease 30ms, transform 520ms linear(0, 0.0693, 0.2322, 0.4328, 0.6312, 0.8028, 0.9356, 1.0269, 1.0807, 1.1039, 1.1052, 1.0924, 1.0726, 1.0508, 1.0307, 1.0141, 1.002, 0.9941, 0.9899, 0.9886, 0.9892, 0.991, 0.9933, 0.9956, 0.9976, 0.9991, 1);
  }
  .lhead { display: flex; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink3); padding-bottom: 4px; border-bottom: 1px solid var(--border); }
  .lrow { display: flex; gap: 12px; font-size: 13px; align-items: baseline; }
  .lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink2); }
  .lqty { flex: 0 0 46px; text-align: right; color: var(--ink3); font-variant-numeric: tabular-nums; }
  .ltot { flex: 0 0 72px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
  .emptylist { margin: auto; padding: 22px; text-align: center; color: var(--ink3); font-size: 13.5px; }
  /* Listed last so it outranks the .open rules above at equal specificity. */
  .detailwrap.instant, .detailwrap.instant .detail { transition: none; }
  .rows { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 12px; }
  .row:hover { background: var(--muted); }
  .rank { flex: 0 0 24px; height: 24px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pname { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pn { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pq { font-size: 12px; color: var(--ink3); }
  .pt { font-family: Manrope, sans-serif; font-size: 14.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .state-msg { margin: auto; max-width: 420px; text-align: center; color: var(--ink2); font-size: 14.5px; padding: 24px; }

  @media (prefers-reduced-motion: reduce) {
    .plot { scroll-behavior: auto; }
    .barfill { transition: background 0.2s ease, opacity 0.2s ease; }
    .chev, .detailwrap, .detail { transition: none !important; }
    .detail { opacity: 1; transform: none; }
  }

  @keyframes rise-a { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes rise-b { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (min-width: 900px) {
    .shell { padding: 36px 40px 20px; gap: 20px; }
    .topbar { flex-direction: row; align-items: center; justify-content: flex-start; }
    .content { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 22px; }
    .hero { padding: 28px 28px 22px; }
    .dayname { font-size: 26px; }
    .daydate { font-size: 14px; }
    .total { font-size: 64px; margin-top: 8px; }
    .cur { font-size: 20px; }
    .delta { font-size: 14.5px; margin-top: 12px; }
    .chart { height: 240px; margin-top: auto; }
    .plot { gap: 10px; }
    .bar { flex: 0 0 32px; }
    .listhead { padding: 22px 24px 10px; }
    .row { padding: 13px 14px; }
  }
</style>
</head>
<body>

<div class="app" id="app" tabindex="0">
  <div class="shell">
    <div class="topbar">
      <div class="pillswrap">
        <div class="pills" id="pills"></div>
        <div class="fade" id="fade"></div>
      </div>
    </div>

    <div class="daterow">
      <div>
        <div class="dayname" id="dayname">&nbsp;</div>
        <div class="daydate" id="daydate">&nbsp;</div>
      </div>
    </div>

    <div class="main" id="main">
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var DAYN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function fmt(n) { return Math.round(n).toLocaleString('en-US'); }
  function compact(n) {
    if (n < 1000) return fmt(n);
    var k = n / 1000;
    return (Math.round(k * 10) / 10).toString().replace(/\.0$/, '') + 'k';
  }
  function niceCeil(n) {
    var exp = Math.pow(10, Math.floor(Math.log10(n)));
    var f = n / exp, steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    for (var i = 0; i < steps.length; i++) { if (steps[i] >= f) return steps[i] * exp; }
    return 10 * exp;
  }
  function stripCode(name) {
    return String(name).replace(/^\[[^\]]*\]\s*/, '').trim();
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---- Build view-model days from the ike-data sales feed (k=0 today ... k=N-1 oldest) ----
  function buildViewDays(rawDays) {
    var asc = rawDays.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var arr = asc.slice().reverse(); // today first
    return arr.map(function (rd, k) {
      var d = new Date(rd.date + 'T00:00:00Z');
      var wd = DAYN[d.getUTCDay()], dn = d.getUTCDate(), mo = MON[d.getUTCMonth()], yr = d.getUTCFullYear();
      // pos = received through the POS, regularSales = received through an
      // accounting payment. Their sum is the money that arrived that day.
      var total = (rd.pos ? rd.pos.total : 0) + (rd.regularSales ? rd.regularSales.total : 0);

      var transactions = (rd.transactions || []).slice()
        .sort(function (a, b) { return b.amount - a.amount; });

      // Products are DERIVED from the transactions rather than stored beside
      // them, so the two views cannot drift apart - they read one source. Once
      // per reference, not once per payment: two instalments against one
      // invoice carry the same line set, and counting both would report twice
      // the goods. Falls back to a stored products array for day entries
      // written before the pipeline began carrying transactions.
      var aggMap = {}, seenRefs = {};
      if (transactions.length) {
        transactions.forEach(function (tx) {
          if (seenRefs[tx.ref]) return;
          seenRefs[tx.ref] = true;
          (tx.lines || []).forEach(function (l) {
            var name = stripCode(l.name);
            var a = aggMap[name] || (aggMap[name] = { name: name, qty: 0, total: 0 });
            a.qty += l.qty; a.total += l.total;
          });
        });
      } else {
        (rd.products || []).forEach(function (p) {
          var name = stripCode(p.name);
          var a = aggMap[name] || (aggMap[name] = { name: name, qty: 0, total: 0 });
          a.qty += p.qty; a.total += p.total;
        });
      }
      var products = Object.keys(aggMap).map(function (n) { return aggMap[n]; })
        .sort(function (a, b) { return b.total - a.total || a.name.localeCompare(b.name); });

      return {
        k: k, date: rd.date, wd: wd, dn: dn, total: total,
        products: products, count: products.length, transactions: transactions,
        label: k === 0 ? 'Today' : wd.slice(0, 3) + ' ' + dn,
        dateFull: dn + ' ' + mo + ' ' + yr,
        short: wd.slice(0, 3) + ' ' + dn + ' ' + mo.slice(0, 3)
      };
    });
  }

  // ---- App ----
  var appEl = document.getElementById('app');
  var pillsEl = document.getElementById('pills');
  var fadeEl = document.getElementById('fade');
  var daynameEl = document.getElementById('dayname');
  var daydateEl = document.getElementById('daydate');
  var mainEl = document.getElementById('main');
  var contentEl = document.getElementById('content');

  var days = [];
  var VIEW_KEY = 'ike-sales-view';
  function loadView() {
    try { return localStorage.getItem(VIEW_KEY) === 'invoices' ? 'invoices' : 'products'; }
    catch (e) { return 'products'; }   // private window, blocked storage
  }
  function saveView(v) { try { localStorage.setItem(VIEW_KEY, v); } catch (e) {} }

  var state = { idx: 0, shown: 0, tick: 0, view: loadView() };
  var touch = null, raf = null;

  function go(i) {
    if (i < 0 || i >= days.length || i === state.idx) return;
    state.idx = i;
    renderDay();
  }

  function parity() { return (++state.tick) % 2 ? 'b' : 'a'; }

  function countUp(from, to) {
    if (raf) cancelAnimationFrame(raf);
    var start = null, dur = 500;
    function step(t) {
      if (start === null) start = t;
      var p = Math.min(1, (t - start) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      setTotalText(from + (to - from) * e);
      if (p < 1) raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
  }
  function setTotalText(v) {
    var el = document.getElementById('heroValue');
    if (el) el.textContent = fmt(v);
  }

  function swipeEnd(x, y) {
    if (!touch) return;
    var dx = x - touch.x, dy = y - touch.y;
    touch = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx > 0) go(state.idx + 1); else go(state.idx - 1);
    }
  }

  function inChart(e) { return !!(e.target && e.target.closest && e.target.closest('.plot')); }

  mainEl.addEventListener('touchstart', function (e) {
    if (inChart(e)) { touch = null; return; }   // that drag is scrolling the chart
    var t = e.touches && e.touches[0];
    if (t) touch = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  mainEl.addEventListener('touchend', function (e) { var t = e.changedTouches && e.changedTouches[0]; if (t) swipeEnd(t.clientX, t.clientY); });
  mainEl.addEventListener('mousedown', function (e) {
    if (inChart(e)) { touch = null; return; }
    touch = { x: e.clientX, y: e.clientY };
  });
  mainEl.addEventListener('mouseup', function (e) { swipeEnd(e.clientX, e.clientY); });
  appEl.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') go(state.idx + 1);
    else if (e.key === 'ArrowRight') go(state.idx - 1);
  });

  // ---- Pills (built once, updated in place) ----
  function buildPills() {
    var ordered = days.slice().reverse(); // oldest left, today right
    pillsEl.innerHTML = ordered.map(function (d) {
      return '<button class="pill" data-idx="' + d.k + '">' + escapeHtml(d.label) + '</button>';
    }).join('');
    pillsEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.pill');
      if (!btn) return;
      go(parseInt(btn.getAttribute('data-idx'), 10));
    });
    pillsEl.addEventListener('scroll', function () { syncFade(); });
    requestAnimationFrame(function () {
      try { pillsEl.scrollLeft = pillsEl.scrollWidth; } catch (e) {}
      syncFade();
    });
  }
  function syncFade() {
    fadeEl.style.opacity = pillsEl.scrollLeft > 2 ? '1' : '0';
  }
  function updatePillStyles() {
    Array.prototype.forEach.call(pillsEl.querySelectorAll('.pill'), function (btn) {
      var k = parseInt(btn.getAttribute('data-idx'), 10);
      var d = days[k];
      var active = k === state.idx;
      btn.style.background = active ? 'var(--accent)' : 'var(--surface)';
      btn.style.color = active ? '#ffffff' : (d.total === 0 ? 'var(--ink3)' : 'var(--ink2)');
      btn.style.boxShadow = active ? '0 6px 14px -6px rgba(0,0,0,0.35)' : '0 1px 2px rgba(13,31,28,0.06)';
    });
    var active = pillsEl.querySelector('[data-idx="' + state.idx + '"]');
    if (active) {
      try {
        pillsEl.scrollTo({ left: Math.max(0, active.offsetLeft - pillsEl.clientWidth / 2 + active.offsetWidth / 2), behavior: 'smooth' });
      } catch (e) {}
    }
  }

  // ---- Chart (axis + bars), isolated so a resize can refresh it without retriggering entrance animations ----
  // ---- Scale: a pure function of the visible WINDOW, never of scroll pixels.
  // That indirection is what charting libraries (ECharts dataZoom, Highstock,
  // TradingView autoScale) all share: gestures move a window, the scale is
  // derived from the window's data. Scroll position is only how the window is
  // worked out here.
  //
  // Recomputed when the scroll SETTLES, not on every scroll event - a trackpad
  // fires one every few pixels, and an axis relabelling several times per
  // gesture reads as broken. Same reason chartjs-plugin-zoom rescales in
  // onPanComplete rather than continuously.

  var MIN_PEAK = 1000;      // 39 of the 60 retained days are empty; without a
                            // floor, scrolling into them divides by zero and
                            // labels the axis 0 / 0 / 0.
  var scalePeak = null;     // the peak the axis currently shows
  var scaleRaf = null, settleTimer = null;

  function reduceMotion() {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  }

  // Which bars the viewport covers. Partially visible bars COUNT: excluding a
  // half-scrolled-in bar that happens to be the tallest would let it render
  // past the top of its own axis.
  function visiblePeak(plot) {
    var bars = plot.querySelectorAll('.bar');
    if (!bars.length) return niceCeil(MIN_PEAK);
    var step = bars.length > 1 ? (bars[1].offsetLeft - bars[0].offsetLeft) : bars[0].offsetWidth;
    if (!step) return niceCeil(MIN_PEAK);

    var first = Math.max(0, Math.floor(plot.scrollLeft / step));
    var last = Math.min(bars.length - 1, Math.ceil((plot.scrollLeft + plot.clientWidth) / step) - 1);
    var max = 0;
    for (var i = first; i <= Math.max(first, last); i++) {
      var total = parseFloat(bars[i].getAttribute('data-total')) || 0;
      if (total > max) max = total;
    }
    return niceCeil(Math.max(MIN_PEAK, max));
  }

  function setAxisText(v) {
    var spans = document.querySelectorAll('#chartWrap .axis span');
    if (spans.length < 2) return;
    spans[0].textContent = compact(v);
    spans[1].textContent = compact(v / 2);
  }

  // The labels have to travel with the bars; numbers hard-swapping under bars
  // that are still moving reads as a glitch rather than a rescale.
  function tweenAxis(from, to, instant) {
    if (scaleRaf) cancelAnimationFrame(scaleRaf);
    if (instant || from === null || reduceMotion()) { setAxisText(to); return; }
    var start = null, dur = 280;
    function step(ts) {
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      setAxisText(from + (to - from) * e);
      if (p < 1) scaleRaf = requestAnimationFrame(step);
    }
    scaleRaf = requestAnimationFrame(step);
  }

  function applyScale(peak, instant) {
    var plot = document.getElementById('chartPlot');
    if (!plot) return;
    Array.prototype.forEach.call(plot.querySelectorAll('.bar'), function (barEl) {
      var total = parseFloat(barEl.getAttribute('data-total')) || 0;
      barEl.querySelector('.barfill').style.height = Math.min(100, total / peak * 100) + '%';
    });
    tweenAxis(scalePeak, peak, instant);
    scalePeak = peak;
  }

  function settleScale(instant) {
    clearTimeout(settleTimer);
    var plot = document.getElementById('chartPlot');
    if (!plot) return;
    var peak = visiblePeak(plot);
    if (peak !== scalePeak) applyScale(peak, instant);
  }

  function scheduleSettle() {
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function () { settleScale(false); }, 120);
  }

  function computeBars() {
    var rawPeak = Math.max(1, Math.max.apply(null, days.map(function (d) { return d.total; })));
    var peak = niceCeil(rawPeak);
    var bars = days.slice().reverse().map(function (d) {   // oldest left, today right
      return {
        k: d.k, label: String(d.dn), total: d.total,
        h: Math.max(0, d.total / peak * 100),
        sel: d.k === state.idx
      };
    });
    return { peak: peak, bars: bars };
  }

  function barHtml(b) {
    return '<div class="bar" data-k="' + b.k + '" data-total="' + b.total + '">' +
      '<div class="barcol"><div class="barfill" style="height:' + b.h + '%;background:' + (b.sel ? 'var(--accent)' : 'var(--ink3)') + ';opacity:' + (b.sel ? 1 : 0.32) + '"></div></div>' +
      '<div class="barlbl">' + (b.sel ? '<span class="disc">' + b.label + '</span>' : b.label) + '</div>' +
      '</div>';
  }

  // The bars never change once the data has loaded, so the markup is built
  // once and a day change only patches the highlight - no re-render, no
  // re-animation, and the scroll position survives.
  function renderChart() {
    var c = computeBars();
    var chartEl = document.getElementById('chartWrap');
    var plot = document.getElementById('chartPlot');

    if (!plot) {
      var axisHtml = '<div class="axis"><span style="top:0">' + compact(c.peak) + '</span><span style="top:50%">' + compact(c.peak / 2) + '</span><span style="top:100%">0</span></div>';
      var barsHtml = c.bars.map(barHtml).join('');
      chartEl.innerHTML = axisHtml +
        '<div class="plotwrap">' +
          '<div class="grid"><i style="top:0"></i><i style="top:50%"></i><i style="top:100%"></i></div>' +
          '<div class="plot" id="chartPlot">' + barsHtml + '</div>' +
        '</div>';
      plot = document.getElementById('chartPlot');
      plot.scrollLeft = plot.scrollWidth; // open on today, at the right-hand end

      // scrollend where supported; the debounce is both the fallback and the
      // safety net for scrolls that never fire it (a programmatic scrollTo).
      plot.addEventListener('scroll', scheduleSettle, { passive: true });
      if ('onscrollend' in window) {
        plot.addEventListener('scrollend', function () { settleScale(false); });
      }
      window.addEventListener('resize', scheduleSettle);

      // Fit to what today's viewport actually shows, before the first paint.
      settleScale(true);
    } else {
      c.bars.forEach(function (b) {
        var barEl = plot.querySelector('.bar[data-k="' + b.k + '"]');
        if (!barEl) return;
        barEl.querySelector('.barfill').style.background = b.sel ? 'var(--accent)' : 'var(--ink3)';
        barEl.querySelector('.barfill').style.opacity = b.sel ? 1 : 0.32;
        barEl.querySelector('.barlbl').innerHTML = b.sel ? '<span class="disc">' + b.label + '</span>' : b.label;
      });
    }
    scrollBarIntoView();
  }

  // Keep the selected day reachable: picking a date from the pills, or swiping,
  // can select a bar that is scrolled out of sight.
  function scrollBarIntoView() {
    var plot = document.getElementById('chartPlot');
    var bar = plot && plot.querySelector('.bar[data-k="' + state.idx + '"]');
    if (!bar) return;
    var target = bar.offsetLeft - plot.clientWidth / 2 + bar.offsetWidth / 2;
    target = Math.max(0, Math.min(target, plot.scrollWidth - plot.clientWidth));
    try { plot.scrollTo({ left: target, behavior: 'smooth' }); }
    catch (e) { plot.scrollLeft = target; }
  }

  // ---- Persistent app shell, built once; day changes patch it in place ----
  function buildApp() {
    contentEl.innerHTML =
      '<div class="card hero">' +
        '<div class="total"><span class="cur">MVR</span><span id="heroValue">0</span></div>' +
        '<div class="delta" id="deltaBlock" style="display:none">' +
          '<svg width="14" height="14" fill="none" stroke="currentColor" style="stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><path d="M7 12V2M2.5 6.5L7 2l4.5 4.5"></path></svg>' +
          '<span></span>' +
        '</div>' +
        '<div class="chart" id="chartWrap"></div>' +
      '</div>' +
      '<div class="card list">' +
        '<div class="listhead">' +
          '<span class="listtitle" id="listTitle">Paid for</span>' +
          '<span class="seg" role="tablist" aria-label="How to list the day">' +
            '<button type="button" role="tab" id="tabProducts" data-view="products" aria-controls="listRows">Products</button>' +
            '<button type="button" role="tab" id="tabInvoices" data-view="invoices" aria-controls="listRows">Invoices</button>' +
          '</span>' +
        '</div>' +
        '<div class="rows" id="listRows" role="tabpanel"></div>' +
      '</div>';

    contentEl.addEventListener('click', function (e) {
      var bar = e.target.closest('.bar');
      if (bar) { go(parseInt(bar.getAttribute('data-k'), 10)); return; }

      var tab = e.target.closest('.seg button');
      if (tab) { setView(tab.getAttribute('data-view')); return; }

      var row = e.target.closest('.row.has');
      if (row) setExpanded(row, row.getAttribute('aria-expanded') !== 'true');
    });

    // Left/right already move between days, so the tablist takes up/down.
    contentEl.addEventListener('keydown', function (e) {
      if (!e.target.closest || !e.target.closest('.seg')) return;
      if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
      e.preventDefault();
      setView(state.view === 'products' ? 'invoices' : 'products');
      var sel = document.querySelector('.seg button[aria-selected="true"]');
      if (sel) sel.focus();
    });
  }

  function renderDay() {
    var day = days[state.idx];
    daynameEl.textContent = day.wd;
    daydateEl.textContent = day.dateFull;

    countUp(state.shown, day.total);
    state.shown = day.total;

    var prev = days[state.idx + 1];
    var deltaEl = document.getElementById('deltaBlock');
    if (prev && prev.total > 0 && day.total > 0) {
      var pct = (day.total - prev.total) / prev.total * 100;
      var up = pct >= 0;
      deltaEl.style.display = '';
      deltaEl.style.color = up ? 'var(--accent)' : 'var(--ink2)';
      deltaEl.querySelector('svg').style.transform = 'rotate(' + (up ? 0 : 180) + 'deg)';
      deltaEl.querySelector('span').textContent = (up ? '+' : '−') + Math.abs(pct).toFixed(1) + '% vs ' + (state.idx === 0 ? 'yesterday' : prev.wd.slice(0, 3));
    } else {
      deltaEl.style.display = 'none';
    }

    renderChart();

    renderList();
    updatePillStyles();
  }

  // ---- The list, in whichever of its two readings is selected ----
  var rowSeq = 0;

  function setView(view) {
    if (view !== 'products' && view !== 'invoices') return;
    if (view === state.view) return;
    state.view = view;
    saveView(view);
    renderList();
  }

  function productRowHtml(p, i, pr) {
    var badgeBg = i === 0 ? 'var(--accent)' : 'var(--muted)';
    var badgeFg = i === 0 ? '#ffffff' : 'var(--ink2)';
    var delay = Math.min(i, 12) * 35 + 'ms';
    return '<div class="row" style="animation: rise-' + pr + ' 320ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '">' +
      '<span class="rank" style="background:' + badgeBg + ';color:' + badgeFg + '">' + (i + 1) + '</span>' +
      '<span class="pname"><span class="pn">' + escapeHtml(p.name) + '</span><span class="pq">' + fmt(p.qty) + (p.qty === 1 ? ' unit' : ' units') + '</span></span>' +
      '<span class="pt">' + fmt(p.total) + '</span>' +
      '</div>';
  }

  function lineHtml(l) {
    return '<div class="lrow">' +
      '<span class="lname">' + escapeHtml(stripCode(l.name)) + '</span>' +
      '<span class="lqty">' + (Math.round(l.qty * 100) / 100) + '</span>' +
      '<span class="ltot">' + fmt(l.total) + '</span>' +
      '</div>';
  }

  function invoiceRowHtml(tx, i, pr) {
    var anon = !tx.customer || tx.customer === 'Walk-in';
    var lines = tx.lines || [];
    var has = lines.length > 0;
    var id = 'lines-' + (++rowSeq);
    var tag = has ? 'button' : 'div';
    var delay = Math.min(i, 12) * 35 + 'ms';

    var head = '<' + tag + ' class="row' + (has ? ' has' : '') + '"' +
      (has ? ' type="button" aria-expanded="false" aria-controls="' + id + '"' : '') + '>' +
      '<span class="ref">' + escapeHtml(tx.ref || '\u2014') + '</span>' +
      '<span class="cust' + (anon ? ' anon' : '') + '">' + escapeHtml(tx.customer || 'Walk-in') + '</span>' +
      '<span class="pt">' + fmt(tx.amount) + '</span>' +
      (has
        ? '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" aria-hidden="true" style="stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M2.5 4.5L6 8l3.5-3.5"></path></svg>'
        : '') +
      '</' + tag + '>';

    var detail = has
      ? '<div class="detailwrap" id="' + id + '" aria-hidden="true"><div class="detailclip"><div class="detail">' +
          '<div class="lhead"><span class="lname">Product</span><span class="lqty">Qty</span><span class="ltot">Total</span></div>' +
          lines.map(lineHtml).join('') +
        '</div></div></div>'
      : '';

    return '<div class="item" style="animation: rise-' + pr + ' 320ms cubic-bezier(0.2,0.8,0.2,1) both;animation-delay:' + delay + '">' +
      head + detail + '</div>';
  }

  function setExpanded(row, open) {
    row.setAttribute('aria-expanded', open ? 'true' : 'false');
    var wrap = document.getElementById(row.getAttribute('aria-controls'));
    if (!wrap) return;
    wrap.classList.toggle('open', open);
    wrap.setAttribute('aria-hidden', open ? 'false' : 'true');
  }

  function renderList() {
    var day = days[state.idx];
    var rowsEl = document.getElementById('listRows');
    if (!day || !rowsEl) return;
    var pr = parity();
    var invoices = state.view === 'invoices';

    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (btn) {
      var on = btn.getAttribute('data-view') === state.view;
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.setAttribute('tabindex', on ? '0' : '-1');
    });

    if (invoices) {
      // Old day entries predate the pipeline carrying transactions; say so
      // rather than showing an empty card that reads as "nothing was sold".
      rowsEl.innerHTML = day.transactions.length
        ? day.transactions.map(function (tx, i) { return invoiceRowHtml(tx, i, pr); }).join('')
        : '<div class="emptylist">' + (day.total > 0
            ? 'No per-invoice detail recorded for this day.'
            : 'Nothing was received on this day.') + '</div>';
    } else {
      rowsEl.innerHTML = day.products.length
        ? day.products.map(function (p, i) { return productRowHtml(p, i, pr); }).join('')
        : '<div class="emptylist">Nothing was received on this day.</div>';
    }
  }

  // ---- Boot ----
  function showMessage(msg) {
    document.querySelector('.shell').innerHTML = '<div class="state-msg">' + escapeHtml(msg) + '</div>';
  }

  var DATA_URL = 'https://raw.githubusercontent.com/yuki-uthman/ike-data/main/data/sales.json';

  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (payload) {
      var rawDays = payload.days || [];
      if (!rawDays.length) {
        showMessage('No sales data yet — the first automatic refresh hasn’t run.');
        return;
      }
      days = buildViewDays(rawDays);
      buildPills();
      buildApp();
      state.idx = 0;
      renderDay();
    })
    .catch(function (err) {
      showMessage('Could not load sales data (' + err.message + '). Try refreshing in a minute.');
    });
})();
</script>
</body>
</html>
