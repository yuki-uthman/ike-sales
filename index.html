    if (host === '127.0.0.1' || host === 'localhost') {
      var m = /[?&]api=([^&]*)/.exec(location.search);
      return m ? decodeURIComponent(m[1]).replace(/\/+$/, '') : '';
    }
    var meta = document.querySelector('meta[name="ike-expenses-service"]');
    return ((meta && meta.getAttribute('content')) || '').trim().replace(/\/+$/, '');
  }
  var BASE = serviceBase();

  // BASE stays the layer ROOT, because it is the single 'is the service
  // configured' fact every gate below reads. The expenses area lives one
  // segment in (decision 17), and this is the only place that segment is
  // written on the calling side.
  var EXPENSES = BASE + '/expenses';

  // One in-closure state object; the renderers read nothing else.
  var state = {
    feedDays: {},      // date -> the feed's day object
    dayList: [TODAY],  // selectable days, newest first
    day: TODAY,
    feedError: null,
    entries: null,     // null = not read yet
    entriesError: null,
    posting: false,
    // The sheet's category list: 'unset' (no service configured), 'loading',
    // 'ready' or 'error'. No copy of D7's 21 names lives in this page, so until
    // the service's own list is read there is nothing to choose and Post is
    // disabled — an entry whose category the service never offered cannot be
    // sent at all, rather than merely being discouraged by a message.
    catsState: BASE ? 'loading' : 'unset',
    catsReason: null,
    // D12's Retry press: the client_entry_id whose call is in flight, so the
    // disabled flag survives every re-render, and one note keyed by row, so a
    // message can only ever appear on the row that was pressed.
    retrying: null,
    retryNote: null
  };

  var CATS_MESSAGE = {
    unset: 'The expenses service is not set up yet.',
    loading: 'Loading the categories…',
    ready: ''
  };

  function catsNote() {
    if (state.catsState === 'error') {
      return 'Could not load the categories (' + state.catsReason +
        '). Try again in a minute.';
    }
    return CATS_MESSAGE[state.catsState];
  }

  var pillsEl = document.getElementById('e-pills');
  var heroLabelEl = document.getElementById('e-heroLabel');
  var heroCountEl = document.getElementById('e-heroCount');
  var heroTotalEl = document.getElementById('e-heroTotal');
  var pendingEl = document.getElementById('e-pending');
  var catsEl = document.getElementById('e-cats');
  var entriesLabelEl = document.getElementById('e-entriesLabel');
  var entriesEl = document.getElementById('e-entries');

  var sheet = document.getElementById('e-sheet');
  var amountEl = document.getElementById('e-amount');
  var categoryEl = document.getElementById('e-category');
  var pinEl = document.getElementById('e-pin');
  var noteEl = document.getElementById('e-note');
  var receiptNameEl = document.getElementById('e-receiptName');
  var cameraEl = document.getElementById('e-camera');
  var galleryEl = document.getElementById('e-gallery');

  function buildPills() {
    pillsEl.innerHTML = '';
    state.dayList.forEach(function (date) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pill';
      b.textContent = pillLabel(date);
      b.setAttribute('data-day', date);
      b.setAttribute('aria-pressed', date === state.day ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (date === state.day) return;
        selectDay(date, true);
      });
      pillsEl.appendChild(b);
    });
  }

  // The two regions fail independently and neither replaces the pane: the FAB
  // and the sheet stay reachable while a source is down, and one unreachable
  // source never blanks the other region's good data.
  function renderFigures() {
    heroLabelEl.textContent = 'Transfers · ' + fullLabel(state.day);
    var day = state.feedDays[state.day];
    var reason = state.feedError
      || (day ? null : 'no totals for ' + state.day + ' yet');
    if (reason) {
      heroCountEl.textContent = '';
      heroTotalEl.textContent = '—';
      pendingEl.textContent = "Could not load the day's totals (" + reason +
        '). Try refreshing in a minute.';
      catsEl.innerHTML = '<div class="empty">No categories shown.</div>';
      return;
    }

    heroCountEl.textContent = plural(day.confirmed.count, 'entry', 'entries');
    heroTotalEl.textContent = money(day.confirmed.total);
    // A figure of its own, not a footnote: this money is not in the total above.
    pendingEl.innerHTML = day.pending.count
      ? 'Pending <b>MVR ' + esc(money(day.pending.total)) + '</b> · ' +
        esc(plural(day.pending.count, 'entry', 'entries')) + ' not counted yet'
      : 'Pending MVR 0 · nothing waiting';

    // The feed's own rows, in the order the feed gives (already total-descending)
    // and with every name as given: history holds Odoo's generic 'Expenses' too,
    // and the read side must not hide money.
    var cats = day.categories || [];
    var top = cats.length ? cats[0].total : 0;
    catsEl.innerHTML = cats.length ? cats.map(function (c) {
      var w = top > 0 ? Math.max(2, Math.round(c.total / top * 100)) : 0;
      return '<div class="catrow">' +
        '<div class="cattop"><span class="catname">' + esc(c.name) + '</span>' +
        '<span class="catamt">' + esc(money(c.total)) + '</span></div>' +
        '<div class="track"><i style="width:' + w + '%"></i></div>' +
        '<span class="catmeta">' + esc(plural(c.count, 'entry', 'entries')) + '</span>' +
        '</div>';
    }).join('') : '<div class="empty">No categories yet today.</div>';
  }

  function renderEntries() {
    entriesLabelEl.textContent = 'Entries · ' + fullLabel(state.day);

    if (!BASE) {
      entriesEl.innerHTML = '<div class="empty">The expenses service is not set up yet.</div>';
      return;
    }
    if (state.entriesError) {
      entriesEl.innerHTML = '<div class="empty">Could not load today\'s entries (' +
        esc(state.entriesError) + '). Nothing is shown as saved.</div>';
      return;
    }
    if (state.entries === null) {
      entriesEl.innerHTML = '<div class="empty">Loading this day’s entries…</div>';
      return;
    }
    entriesEl.innerHTML = state.entries.length ? state.entries.map(function (e) {
      // The bar appears exactly when the service's own projection carries a
      // next-retry time. The automatic retry stays true after a failed press,
      // so its sentence stays and the note is one more sentence beside it.
      var note = state.retryNote && state.retryNote.id === e.client_entry_id
        ? ' ' + esc(state.retryNote.text)
        : '';
      var retry = e.next_retry_at
        ? '<div class="retrybar"><span>Odoo did not answer. The entry is safe here. ' +
          'It will try again at ' + esc(e.next_retry_at) + '.' + note + '</span>' +
          '<button class="retry" type="button" data-entry="' + esc(e.client_entry_id) + '"' +
          (state.retrying === e.client_entry_id ? ' disabled' : '') + '>Retry</button></div>'
        : '';
      var cls = CHIP_CLASS[e.status] || '';
      return '<div class="item">' +
        '<div class="itemtop">' +
          '<div class="what"><span class="cat">' + esc(e.category) + '</span>' +
          '<span class="when">Bank transfer</span></div>' +
          '<div class="amtwrap"><span class="amt">' + esc(e.amount_mvr) + '</span>' +
          '<span class="chip ' + cls + '">' + esc(e.status) + '</span></div>' +
        '</div>' + retry +
        '</div>';
    }).join('') : '<div class="empty">Nothing added for this day yet.</div>';
  }

  // This rendering touches only the note and the button's disabled flag: it
  // never clears or rewrites anything the user typed, and the FAB and the sheet
  // stay reachable while the service is down.
  function renderCategories() {
    postBtn.disabled = state.catsState !== 'ready' || state.posting;
    if (state.catsState === 'ready') {
      // Do not speak over a post outcome: clear only our own words.
      if (noteEl.textContent === CATS_MESSAGE.loading
          || noteEl.textContent === CATS_MESSAGE.unset
          || noteEl.textContent.indexOf('Could not load the categories (') === 0) {
        noteEl.textContent = '';
      }
      return;
    }
    noteEl.textContent = catsNote();
  }

  function render() {
    Array.prototype.slice.call(pillsEl.children).forEach(function (b) {
      b.setAttribute('aria-pressed',
        b.getAttribute('data-day') === state.day ? 'true' : 'false');
    });
    renderFigures();
    renderEntries();
  }

  // ---- The sources ----
  function loadFeed() {
    return fetch(EXPENSES_URL, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (doc) {
        var days = (doc && doc.days) || [];
        var map = {}, dates = [];
        days.forEach(function (d) {
          if (!d || !d.date) return;
          map[d.date] = d;
          dates.push(d.date);
        });
        dates.sort();
        dates.reverse();
        if (dates.indexOf(TODAY) < 0) dates.unshift(TODAY);
        state.feedDays = map;
        state.dayList = dates;
        state.feedError = null;
        if (dates.indexOf(state.day) < 0) {
          state.day = TODAY;
          state.entries = null;
          state.entriesError = null;
          loadEntries();
        }
        buildPills();
        render();
      })
      .catch(function (err) {
        state.feedError = err.message;
        render();
      });
  }

  function loadEntries() {
    if (!BASE) { renderEntries(); return Promise.resolve(); }
    var asked = state.day;
    return fetch(EXPENSES + '/entries?date=' + encodeURIComponent(asked), { cache: 'no-store' })
      .then(function (res) {
        return res.json().catch(function () { return {}; })
          .then(function (body) { return { status: res.status, body: body }; });
      })
      .then(function (r) {
        if (asked !== state.day) return;
        if (r.status === 200 && r.body && r.body.entries) {
          state.entries = r.body.entries;
          state.entriesError = null;
        } else {
          state.entries = null;
          state.entriesError = (r.body && r.body.error) || ('HTTP ' + r.status);
        }
        renderEntries();
      })
      .catch(function () {
        if (asked !== state.day) return;
        state.entries = null;
        state.entriesError = 'service unreachable';
        renderEntries();
      });
  }

  // D12's Retry press. The row that comes back is the service's own projection,
  // so 'Draft' on success and 'Not sent' with the NEW next-try time are both the
  // Worker's words; this never patches a chip and never reasons about a status.
  // One press at a time, and no reload.
  function retryEntry(id) {
    if (!BASE || !id || state.retrying) return Promise.resolve();
    state.retrying = id;
    state.retryNote = null;
    renderEntries();

    var done = function (text) {
      state.retrying = null;
      state.retryNote = text ? { id: id, text: text } : null;
      renderEntries();
    };
    // Every failure a press can meet — an origin refusal, a dead service, a
    // 404 or a 503 — is one event the person cannot act on differently, and no
    // body of theirs may ever be shown raw.
    var MESSAGE = 'Could not reach the expenses service just now. ' +
      'The entry is safe here — try again.';

    return fetch(EXPENSES + '/entries/' + encodeURIComponent(id) + '/retry',
      { method: 'POST' })
      .then(function (res) {
        return res.json().catch(function () { return {}; })
          .then(function (body) { return { status: res.status, body: body }; });
      })
      .then(function (r) {
        if (r.status === 200 && r.body && r.body.entry) {
          var fresh = r.body.entry;
          state.entries = (state.entries || []).map(function (e) {
            return e.client_entry_id === fresh.client_entry_id ? fresh : e;
          });
          done(null);
          return;
        }
        done(MESSAGE);
      })
      .catch(function () { done(MESSAGE); });
  }

  // The list is rebuilt with innerHTML on every render, so the press is heard
  // once on the card itself rather than on buttons that do not outlive a poll.
  entriesEl.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('button.retry') : null;
    if (!btn || btn.disabled) return;
    retryEntry(btn.getAttribute('data-entry'));
  });

  function loadCategories() {
    if (!BASE) {
      state.catsState = 'unset';
      state.catsReason = null;
      renderCategories();
      return Promise.resolve();
    }
    if (state.catsState !== 'ready') {
      // 'Loading…' exists so a fast FAB tap cannot show a failure that has not
      // happened yet.
      state.catsState = 'loading';
      renderCategories();
    }
    return fetch(EXPENSES + '/categories', { cache: 'no-store' })
      .then(function (res) {
        // A rejected fetch and an origin refusal are the one event (decision
        // 12); a non-200 names its status instead.
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (body) {
        var cats = (body && body.categories) || [];
        if (!cats.length) throw new Error('no categories');
        // A re-read must not speak over a choice already made: the list is
        // rebuilt only when it differs, and the chosen category survives it.
        var had = Array.prototype.map.call(categoryEl.options, function (o) {
          return o.value;
        });
        var same = had.length === cats.length && had.every(function (v, i) {
          return v === cats[i];
        });
        if (!same) {
          var chosen = categoryEl.value;
          categoryEl.innerHTML = '';
          cats.forEach(function (c) {
            var o = document.createElement('option');
            o.textContent = c;
            o.value = c;
            categoryEl.appendChild(o);
          });
          if (chosen && cats.indexOf(chosen) >= 0) categoryEl.value = chosen;
        }
        state.catsState = 'ready';
        state.catsReason = null;
        renderCategories();
      })
      .catch(function (err) {
        state.catsState = 'error';
        state.catsReason = /^(HTTP \d+|no categories)$/.test(err.message)
          ? err.message
          : 'service unreachable';
        renderCategories();
      });
  }

  function selectDay(date, broadcast) {
    if (state.dayList.indexOf(date) < 0) return;
    if (state.day === date) return;
    state.day = date;
    state.entries = null;
    state.entriesError = null;
    // One selected day for the whole app: Sales hears this too.
    if (broadcast) window.ikeDay.set(date, 'expenses');
    render();
    loadEntries();
  }

  // The id of the entry currently typed in the sheet, minted once and kept
  // across a lost answer; the PIN itself is never stored anywhere.
  var pendingId = null;

  function openSheet() {
    pendingId = null;
    noteEl.textContent = '';
    receiptNameEl.textContent = '';
    // The list is re-read on every open, so a service that comes back fills the
    // select with no reload; the state decides the note and the button.
    loadCategories();
    amountEl.value = '';
    pinEl.value = '';
    cameraEl.value = '';
    galleryEl.value = '';
    categoryEl.selectedIndex = 0;
    sheet.hidden = false;
    amountEl.focus();
  }
  function closeSheet() {
    pendingId = null;
    pinEl.value = '';
    sheet.hidden = true;
    document.getElementById('e-add').focus();
  }

  function showReceipt(input) {
    return function () {
      var f = input.files && input.files[0];
      receiptNameEl.textContent = f ? 'Receipt attached: ' + f.name : '';
    };
  }
  cameraEl.addEventListener('change', showReceipt(cameraEl));
  galleryEl.addEventListener('change', showReceipt(galleryEl));

  document.getElementById('e-add').addEventListener('click', openSheet);
  document.getElementById('e-cancel').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  });

  // ---- The receipt, brought under the Worker's cap before anything is sent ----
  function pickedFile() {
    return (cameraEl.files && cameraEl.files[0])
      || (galleryEl.files && galleryEl.files[0])
      || null;
  }

  function blobToBase64(blob, ok, bad) {
    var r = new FileReader();
    r.onload = function () {
      var s = String(r.result);
      ok(s.slice(s.indexOf(',') + 1));
    };
    r.onerror = function () { bad(); };
    r.readAsDataURL(blob);
  }

  var ATTEMPTS = [[1600, 0.80], [1600, 0.60], [1600, 0.45], [1200, 0.60], [900, 0.45]];

  function prepareReceipt(file, ok, bad) {
    if (!file) { ok(null); return; }
    if (file.size <= RECEIPT_CAP_BYTES) { blobToBase64(file, ok, bad); return; }
    if (!window.createImageBitmap) { bad(); return; }
    window.createImageBitmap(file).then(function (bmp) {
      var i = 0;
      function attempt() {
        if (i >= ATTEMPTS.length) { bad(); return; }
        var edge = ATTEMPTS[i][0], quality = ATTEMPTS[i][1];
        i += 1;
        var scale = Math.min(1, edge / Math.max(bmp.width, bmp.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(bmp.width * scale));
        c.height = Math.max(1, Math.round(bmp.height * scale));
        c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
        c.toBlob(function (blob) {
          if (!blob || blob.size > RECEIPT_CAP_BYTES) { attempt(); return; }
          blobToBase64(blob, ok, bad);
        }, 'image/jpeg', quality);
      }
      attempt();
    }).catch(function () { bad(); });
  }

  // ---- The save ----
  function hhmm(iso8601) {
    var d = new Date(iso8601);
    if (isNaN(d.getTime())) return String(iso8601);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function refusalMessage(status, body) {
    var error = (body && body.error) || '';
    if (status === 403 && error === 'wrong_pin') {
      return 'That PIN was not accepted. Check it and try again.';
    }
    if (status === 429) {
      return 'Too many wrong PINs. Try again after ' + hhmm(body && body.retry_at) + '.';
    }
    if (error === 'unknown_category') return 'Choose one of the listed categories.';
    if (error === 'amount_not_positive_mvr') {
      return 'Enter the amount in MVR as a positive number.';
    }
    if (error === 'receipt_too_large') {
      return 'This receipt is too large to send. Post it without the receipt.';
    }
    if (error === 'not_stored') {
      return 'The service could not save it. Your entry is still here — try again.';
    }
    return 'The service refused this entry (' + (error || status) + '). Nothing was saved.';
  }

  var postBtn = document.getElementById('e-postBtn');

  function send(base64) {
    // Minted once per typed entry, not once per press: a lost answer cannot
    // become a second entry.
    if (!pendingId) pendingId = crypto.randomUUID();
    var body = {
      pin: pinEl.value,
      category: categoryEl.value,
      amount: String(amountEl.value).replace(/,/g, '').trim(),
      client_entry_id: pendingId
    };
    if (base64) body.receipt = base64;

    fetch(EXPENSES + '/entries', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        return res.json().catch(function () { return {}; })
          .then(function (b) { return { status: res.status, body: b }; });
      })
      .then(function (r) {
        state.posting = false;
        postBtn.disabled = false;
        if (r.status === 200 && r.body && r.body.saved === true && r.body.entry) {
          // The row is the service's own `entry`, never the typed input, and the
          // day is the day the Worker filed it under (D16).
          pendingId = null;
          closeSheet();
          var wasDay = state.day;
          if (state.dayList.indexOf(TODAY) < 0) {
            state.dayList.unshift(TODAY);
            buildPills();
          }
          if (wasDay !== TODAY) {
            state.day = TODAY;
            state.entries = null;
            state.entriesError = null;
            window.ikeDay.set(TODAY, 'expenses');
          }
          state.entries = (state.entries || []).concat([r.body.entry]);
          state.entriesError = null;
          render();
          loadEntries();
          return;
        }
        noteEl.textContent = refusalMessage(r.status, r.body);
      })
      .catch(function () {
        // An origin refusal and a dead service are the same event to the page.
        state.posting = false;
        postBtn.disabled = false;
        noteEl.textContent =
          'Could not reach the expenses service. Your entry is still here — try again.';
      });
  }

  postBtn.addEventListener('click', function () {
    if (state.posting) return;
    var amount = parseFloat(String(amountEl.value).replace(/,/g, ''));
    if (!isFinite(amount) || amount <= 0) {
      noteEl.textContent = 'Enter the amount in MVR.';
      amountEl.focus();
      return;
    }
    if (!pinEl.value) {
      noteEl.textContent = 'Enter your PIN.';
      pinEl.focus();
      return;
    }
    if (!BASE) {
      noteEl.textContent = 'The expenses service is not set up yet.';
      return;
    }
    state.posting = true;
    postBtn.disabled = true;
    noteEl.textContent = 'Sending…';
    prepareReceipt(pickedFile(), send, function () {
      state.posting = false;
      postBtn.disabled = false;
      noteEl.textContent = 'This receipt could not be prepared. ' +
        'Post it without the receipt or take another photo.';
    });
  });

  // One selected day for the whole app. A day this pane does not know about
  // leaves it where it is rather than blanking.
  window.ikeDay.on('expenses', function (date) {
    selectDay(date, false);
  });

  var start = window.ikeDay.get();
  if (start && state.dayList.indexOf(start) >= 0) state.day = start;
  buildPills();
  render();
  loadCategories();
  loadFeed();
  loadEntries();
  setInterval(function () { loadFeed(); loadEntries(); loadCategories(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { loadFeed(); loadEntries(); loadCategories(); }
  });
})();
</script>
</body>
</html>
